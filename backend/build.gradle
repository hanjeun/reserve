dependencies {
    // AWS SDK Platform BOM ??ê´€???˜ì¡´?±ë³´??ë¨¼ì? ? ì–¸?´ë‘??ê²?ê´€ë¡€??ê°€?…ì„±??ì¢‹ìŒ(ê¸°ëŠ¥??ì°¨ì´???†ìŒ)
    implementation platform('software.amazon.awssdk:bom:2.48.4')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AWS S3 (?´ë?ì§€ ?…ë¡œ??+ Pre-signed URL)
    implementation 'software.amazon.awssdk:s3'


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
