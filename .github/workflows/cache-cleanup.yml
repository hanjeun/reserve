name: Cache Cleanup

# 닫힌 PR 전용 캐시를 정리해 공유 캐시 공간을 확보한다.
# 쓰기 권한은 pull_request_target으로 얻되 PR 코드는 체크아웃하지 않는다.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches of the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id' | while read -r id; do
            gh cache delete "$id"
          done
