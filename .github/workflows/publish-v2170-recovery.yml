name: Publish v2.17.0 recovery

on:
  push:
    branches: [codex/publish-v2170-recovery]
    paths: [.github/workflows/publish-v2170-recovery.yml]

permissions:
  contents: read

concurrency:
  group: reserve-recovery-v2.17.0-7ac21326

env:
  RECOVERY_SHA: 7ac213269aedd3986c42ec8740cc61a6dbc05b1f
  RECOVERY_TAG: hanjeun/reserve:recovery-v2.17.0-7ac21326

jobs:
  publish:
    if: github.repository == 'hanjeun/reserve' && github.ref == 'refs/heads/codex/publish-v2170-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RECOVERY_SHA }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Configure recovery frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PORTONE_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_CHANNEL_KEY }}
          VITE_PORTONE_NAVERPAY_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_NAVERPAY_CHANNEL_KEY }}
          VITE_PORTONE_TOSS_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_TOSS_CHANNEL_KEY }}
          VITE_PORTONE_TOSS_EASY_PAY_PROVIDERS: ${{ vars.VITE_PORTONE_TOSS_EASY_PAY_PROVIDERS }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          RESERVE_DOMAIN_SPLIT: ${{ vars.RESERVE_DOMAIN_SPLIT || 'false' }}
        run: |
          case "$RESERVE_DOMAIN_SPLIT" in
            true) VITE_API_BASE_URL=''; VITE_APP_ORIGIN=https://app.reserve.it.kr ;;
            false) VITE_APP_ORIGIN=https://reserve.it.kr ;;
            *) echo 'RESERVE_DOMAIN_SPLIT must be true or false'; exit 1 ;;
          esac
          cat > .env.production << EOF
          VITE_API_BASE_URL=$VITE_API_BASE_URL
          VITE_API_VERSION=v1
          VITE_PORTONE_CHANNEL_KEY=$VITE_PORTONE_CHANNEL_KEY
          VITE_PORTONE_NAVERPAY_CHANNEL_KEY=$VITE_PORTONE_NAVERPAY_CHANNEL_KEY
          VITE_PORTONE_TOSS_CHANNEL_KEY=$VITE_PORTONE_TOSS_CHANNEL_KEY
          VITE_PORTONE_TOSS_EASY_PAY_PROVIDERS=$VITE_PORTONE_TOSS_EASY_PAY_PROVIDERS
          VITE_SKELETON_DELAY=0
          VITE_SENTRY_DSN=$VITE_SENTRY_DSN
          VITE_KAKAO_JS_KEY=$VITE_KAKAO_JS_KEY
          VITE_APP_ORIGIN=$VITE_APP_ORIGIN
          VITE_MARKETING_ORIGIN=https://reserve.it.kr
          VITE_LEGACY_APP_ORIGIN=https://reserve.it.kr
          EOF

      - name: Build matching recovery frontend
        run: |
          node scripts/check-secret-boundaries.mjs --include frontend/.env.production
          npm --prefix frontend run build
          printf '%s\n' "$RECOVERY_SHA" > frontend/dist/release-id.txt
        env:
          RELEASE_ID: ${{ env.RECOVERY_SHA }}

      - name: Package recovery backend
        run: |
          test "$(git rev-parse HEAD)" = "$RECOVERY_SHA"
          cd backend
          chmod +x ./gradlew
          ./gradlew bootJar --console=plain --no-build-cache

      - name: Build and verify recovery image
        run: |
          docker build --pull --no-cache --platform linux/amd64 \
            --label reserve.schema-compat=v280-mfa-completion-settlement-v1 \
            --label reserve.feature-compat=waiting-signup-hidden-feed-oauth-login-session-admission-mfa-completion-test-settlement-v11 \
            --label "org.opencontainers.image.revision=$RECOVERY_SHA" \
            -t "reserve-security:$RECOVERY_SHA" ./backend
          image_id=$(docker image inspect --format '{{.Id}}' "reserve-security:$RECOVERY_SHA")
          bash scripts/check-release-compatibility-image.sh "$image_id"
          bash scripts/scan-container-security.sh "reserve-security:$RECOVERY_SHA"
          jar_sha=$(sha256sum backend/build/libs/reserve-2.17.0.jar | cut -d ' ' -f 1)
          image_jar_sha=$(docker run --rm --network none --read-only --entrypoint sha256sum "$image_id" /app.jar | cut -d ' ' -f 1)
          [[ "$jar_sha" =~ ^[0-9a-f]{64}$ && "$jar_sha" = "$image_jar_sha" ]]
          jq -n --arg source "$RECOVERY_SHA" --arg imageId "$image_id" --arg jarSha256 "$jar_sha" \
            '{source: $source, imageId: $imageId, jarSha256: $jarSha256}' > reserve-recovery.json

      - name: Build matching recovery marketing site
        if: vars.RESERVE_DOMAIN_SPLIT == 'true'
        env:
          RELEASE_ID: ${{ env.RECOVERY_SHA }}
        run: node marketing/build.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reserve-recovery-v2.17.0-7ac21326
          path: |
            frontend/dist/
            marketing/dist/
            reserve-recovery.json
          if-no-files-found: error
          retention-days: 7

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish only the recovery tag
        run: |
          if inspection=$(docker buildx imagetools inspect "$RECOVERY_TAG" 2>&1); then
            echo 'Recovery tag already exists'
            exit 1
          elif [[ "$inspection" != *'not found'* ]]; then
            echo 'Could not confirm that the recovery tag is absent'
            exit 1
          fi
          image_id=$(jq -er .imageId reserve-recovery.json)
          docker tag "$image_id" "$RECOVERY_TAG"
          docker push "$RECOVERY_TAG"
          digest=$(docker buildx imagetools inspect "$RECOVERY_TAG" --format '{{json .Manifest}}' | jq -er .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Recovery image `hanjeun/reserve@%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
