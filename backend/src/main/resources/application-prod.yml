# 배포 환경 공통 설정 (Blue/Green 공통)

spring:
  config:
    activate:
      on-profile: prod

  # Docker MySQL 연결
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:reserve_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  # OAuth2 Redirect URI (배포 도메인)
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          naver:
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
          kakao:
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"

# 명시적으로 켰을 때만 Redis를 사용하며 내부 서비스 이름이나 RFC1918 주소만 허용한다.
reserve:
  service-admission:
    # 명시적으로 켜야 하며 정원·수명 설정은 application-common.yml과 공유한다.
    enabled: ${RESERVE_SERVICE_ADMISSION_ENABLED:false}
    automatic:
      enabled: ${RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED:false}
  redis:
    host: ${RESERVE_REDIS_HOST:}

# 호출 제한·릴레이는 제한된 대체 경로를 사용하지만 활성 입장 관문은 Redis 장애 시 허용하지 않는다.
management:
  health:
    redis:
      enabled: false

# 서버 공통 설정 (포트는 blue/green에서 개별 설정)
server:
  serverAddress: reserve.it.kr
  env: prod
  forward-headers-strategy: native

# 프론트엔드 URL
app:
  frontend-url: ${APP_FRONTEND_URL:https://reserve.it.kr}

# CORS 허용 출처 (쉼표 구분 — SecurityConfig의 @Value List<String> 바인딩)
# SiteUrls가 설정된 앱·기존 OAuth 복구 출처를 추가한다. localhost·ngrok은 local.yml에만 둔다.
cors:
  allowed-origins: "https://reserve.it.kr"

# 가게 목록은 MySQL/ngram=2와 일치하는 다섯 컬럼 색인에서만 후보 검색을 사용한다.
# 원문 count·공개 필터·정렬의 동등성이 맞지 않거나 오류가 나면 LIKE로 복귀한다.
# search.store.fulltext-enabled=false는 탐지도 끈다. 미설치 판정은 앱 기동 동안 캐시한다.
# 통합검색은 search.store.unified-fulltext-enabled=false가 기본이며 count 비용을 별도로 검증한 뒤 켠다.

# 운영 환경 로깅 — DEBUG 로그 비활성화
logging:
  level:
    root: WARN
    kr.it.reserve: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
