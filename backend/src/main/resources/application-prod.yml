# ============================================
# 배포 환경 공통 설정 (Blue/Green 공통)
# ============================================

spring:
  config:
    activate:
      on-profile: prod

  # Docker MySQL 연결
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 1234

  # OAuth2 Redirect URI (배포 도메인)
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: https://reserve.hktech.kr/login/oauth2/code/google
          naver:
            redirect-uri: https://reserve.hktech.kr/login/oauth2/code/naver
          kakao:
            redirect-uri: https://reserve.hktech.kr/login/oauth2/code/kakao

# 서버 공통 설정 (포트는 blue/green에서 개별 설정)
server:
  serverAddress: reserve.hktech.kr
