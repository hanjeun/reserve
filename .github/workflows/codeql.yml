name: CodeQL

# 배포와 별도로 코드 변경과 정기 일정에 따라 보안 분석을 실행한다.
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # 코드 변경이 없어도 새 분석 규칙을 적용하도록 매주 월요일 03:00 UTC에 검사한다.
    - cron: '0 3 * * 1'

# 같은 ref의 새 입력이 오면 오래된 분석만 취소한다.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # 스캔 결과를 Security 탭에 업로드
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # 분석에 필요한 클래스만 만들며 테스트·HTML·릴리스 JAR 검증은 CICD에서 수행한다.
      - name: Build backend for analysis
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew classes --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          category: "/language:${{ matrix.language }}"
