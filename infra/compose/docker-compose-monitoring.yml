# 기존 볼륨과 수집기 상태를 대조한 뒤 승인된 운영 범위에서 적용한다.

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    # 재동기화마다 조회 가능한 테이블 목록을 갱신한다.
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -boltdb.shipper.query-ready-num-days=1
    # Promtail은 app-network의 loki:3100으로 접근한다. 호스트에 publish할 이유가 없다.
    expose:
      - "3100"
    volumes:
      # 컨테이너 재생성 때 로그 이력을 잃지 않도록 별도 볼륨에 보관한다.
      - loki-data:/loki
    networks:
      - app-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - /var/log/reserve:/var/log/reserve:ro
      - /var/log/metrics:/var/log/metrics:ro
      # 저장소 파일과 별개인 서버의 실제 Promtail 설정을 마운트한다.
      - ~/promtail-config.yml:/etc/promtail/config.yml
      # 재기동 후 로그를 처음부터 재전송하지 않도록 읽기 위치를 별도 볼륨에 보관한다.
      - promtail-positions:/tmp
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    # nginx도 같은 app-network에서 grafana:3000으로 프록시한다. 외부 공개는 nginx만 담당한다.
    expose:
      - "3000"
    environment:
      # 초기 볼륨 생성에만 쓰는 비밀번호 시드는 보호된 환경변수에서 읽는다.
      # 기존 계정이 있는 인스턴스의 재기동을 막지 않도록 빈 값은 허용한다.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - app-network
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data:
  promtail-positions:

networks:
  app-network:
    external: true
