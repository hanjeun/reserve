# ============================================
# 모든 환경 공통 설정
# ============================================

# 서버 공통 설정
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      tracking-modes: cookie
      timeout: 30m
      cookie:
        max-age: 1800

# Spring 공통 설정
spring:
  web:
    resources:
      add-mappings: true

  # 파일 업로드
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2MB

  # JPA 공통 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # HikariCP 커넥션 풀 설정 (죽은 커넥션 빠르게 감지/교체)
  datasource:
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 3000
      connection-timeout: 10000
      max-lifetime: 580000       # MySQL wait_timeout(600s)보다 짧게
      keepalive-time: 60000      # 60초마다 커넥션 유지 쿼리

  # OAuth2 Provider 설정 (공통)
  security:
    oauth2:
      client:
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# JWT 설정
jwt:
  issuer: reserve
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 14

# 로깅 설정
logging:
  level:
    root: INFO
    com.reserve: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 메일 설정
mail:
  host: smtp.resend.com
  port: 465
  from: ${MAIL_FROM:reserve@reserve.it.kr}
  from-name: ${MAIL_FROM_NAME:RESERVE}
  webhook-secret: ${MAIL_WEBHOOK_SECRET:}
  properties:
    mail:
      smtp:
        auth: true
        ssl:
          enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# 포트원 설정
portone:
  pg-provider: ${PORTONE_PG_PROVIDER:kakaopay}

# CORS 허용 출처
cors:
  allowed-origins:
    - https://reserve.it.kr

# Actuator (헬스체크)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never   # 운영 환경에서 내부 정보 비노출
