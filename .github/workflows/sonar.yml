name: Sonar CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('코드 분석 · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || format('전체 코드 분석 · {0}', github.ref_name) }}

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Enable after SONAR_TOKEN is registered and automatic analysis is disabled.
    # Fork code never receives the analysis credential.
    if: >-
      vars.SONAR_CI_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Compile Java analysis inputs
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew classes testClasses --console=plain
      - name: Restore verified backend coverage
        id: backend_coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TEST_CONFIG_REVISION: ${{ vars.CI_TEST_CONFIG_REVISION }}
          CI_REQUIRE_COVERAGE: 'true'
          CI_COVERAGE_WAIT_SECONDS: ${{ github.event_name == 'pull_request' && '900' || '0' }}
        run: node scripts/ci-evidence.mjs restore backend
      - name: Restore verified frontend coverage
        id: frontend_coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TEST_CONFIG_REVISION: ${{ vars.CI_TEST_CONFIG_REVISION }}
          CI_REQUIRE_COVERAGE: 'true'
          CI_COVERAGE_WAIT_SECONDS: ${{ github.event_name == 'pull_request' && '900' || '0' }}
        run: node scripts/ci-evidence.mjs restore frontend
      - name: Generate backend coverage when no reusable report exists
        if: steps.backend_coverage.outputs.reused != 'true'
        working-directory: backend
        run: ./gradlew -I ../scripts/coverage.init.gradle test jacocoTestReport --console=plain
      - name: Generate frontend coverage when no reusable report exists
        if: steps.frontend_coverage.outputs.reused != 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
      - name: Analyze backend and frontend
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'SONAR_TOKEN is required'; exit 1; }
          ./gradlew -I ../scripts/sonar-ci.init.gradle sonar --console=plain
