# compose는 서버의 ~/promtail-config.yml을 사용하므로 저장소 수정만으로 운영에 반영되지 않는다.
# 복구에 사용할 때 nginx 디렉터리 오버레이를 검증하고 Promtail만 재생성한다.
# 읽기 위치 볼륨을 보존하며 복구 조건은 docs/technical/monitoring.md를 따른다.

server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 재수집해도 앱의 기록 시각을 유지하도록 pipeline_stages에서 시각을 파싱한다.
  # location: UTC는 logback의 %d{yyyy-MM-dd HH:mm:ss}와 같은 시간대를 사용해야 한다.
  # level 인덱스 라벨로 수준을 필터링해 본문 검색 비용과 단어 오탐을 피한다.
  - job_name: reserve
    static_configs:
      - targets:
          - localhost
        labels:
          job: reserve
          __path__: /var/log/reserve/app.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) +(?P<level>[A-Z]+)'
      - labels:
          level:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05'
          location: UTC

  # 앱과 다른 백업 로그 형식을 사용하며 기존 두 형식을 모두 허용한다.
  - job_name: backup
    static_configs:
      - targets:
          - localhost
        labels:
          job: backup
          __path__: /var/log/reserve/backup.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) +(?:(?P<level>[A-Z]+) +)?\[backup\]'
      - labels:
          level:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05'
          location: UTC

  # Docker 소켓이나 다른 로그 대신 nginx 컨테이너의 디렉터리만 연결한다.
  # 개인정보를 제외한 reserve_timing 스키마와 정확히 일치하는 행만 수집한다.
  # 재시작해도 Docker의 기록 시각을 유지하며 stderr는 전송하지 않는다.
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/reserve-nginx/*-json.log
    pipeline_stages:
      - docker: {}
      - drop:
          older_than: 1h
          drop_counter_reason: nginx_older_than_1h
      - match:
          selector: '{job="nginx", stream!="stdout"}'
          action: drop
          drop_counter_reason: nginx_non_stdout
      - match:
          selector: '{job="nginx"} !~ "^\\{\"time\":\"[0-9]+[.][0-9]+\",\"route\":\"(spa|asset|store_detail|store_list|chat|api_other|health)\",\"method\":\"(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|TRACE|CONNECT)\",\"status\":[1-5][0-9]{2},\"request_time\":\"[0-9]+[.][0-9]+\",\"upstream_connect_time\":\"[-0-9.,: ]*\",\"upstream_header_time\":\"[-0-9.,: ]*\",\"upstream_response_time\":\"[-0-9.,: ]*\",\"cache\":\"(HIT|MISS|BYPASS|EXPIRED|STALE|UPDATING|REVALIDATED|-|)\"\\}[[:space:]]*$"'
          action: drop
          drop_counter_reason: nginx_non_timing

  # scripts/collect-metrics.sh를 cron에서 매분 실행해 지표를 생성한다.
  # 2GB 환경의 blue/green 두 앱(각 약 600MB)과 수집기의 메모리 경합을 피한다.
  # Prometheus·node_exporter의 추가 170~320MB 대신 지표용 상주 프로세스 없이 1분 해상도를 사용한다.
  # 지표 행에는 시각 필드가 없고 읽은 시각이 표본 시각이므로 timestamp 단계를 두지 않는다.
  - job_name: metrics
    static_configs:
      - targets:
          - localhost
        labels:
          job: metrics
          __path__: /var/log/metrics/*.log
