<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESERVE API</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            margin: 0;
            /* Pretendard 를 앞에 둔다 — 설치돼 있으면 앱과 같은 글꼴로 보이고, 없으면 아래 시스템
               글꼴로 조용히 내려간다(윈도우 맑은 고딕 등). 그래서 "로고만 다른 글꼴"이 아니게 된다.

               ⚠️ 여기서 웹폰트를 받아오지 않는다. 앱은 npm 패키지(pretendard)를 번들에 넣어
               self-host 하는데, 그 산출물은 해시가 붙은 프론트 dist 자산이라 백엔드가 참조할 수 없다.
               폰트 파일을 이 static 폴더에 복사하면 2MB 가 jar 에 들어가는데, 개발자만 보는
               안내 페이지 하나 때문에 배포 아티팩트를 불릴 이유가 없다.
               CDN <link> 는 이 프로젝트가 명시적으로 버린 방식이다(useTheme.js 주석 참고 —
               외부 의존·프라이버시·CSP·방식 일관성 4가지 이유). */
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { text-align: center; padding: 40px; }
        .logo { font-size: 36px; font-weight: 800; color: #3182f6; margin-bottom: 8px; }
        .badge {
            display: inline-block;
            background: #e6f4ff; color: #1677ff;
            border-radius: 4px; padding: 2px 10px;
            font-size: 12px; font-weight: 600; margin-bottom: 24px;
        }
        .desc { color: #888; font-size: 14px; margin-bottom: 32px; }
        .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .link {
            background: #fff; border: 1px solid #e0e0e0;
            border-radius: 8px; padding: 10px 20px;
            font-size: 13px; color: #3182f6; text-decoration: none; font-weight: 500;
        }
        .link:hover { border-color: #3182f6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">RESERVE</div>
        <div class="badge">Local API Server · :8080</div>
        <p class="desc">Spring Boot API is running</p>
        <div class="links">
            <a class="link" href="/hc">Health Check</a>
            <a class="link" href="/actuator/health">Actuator</a>
            <a class="link" href="http://localhost:5173" target="_blank">Frontend →</a>
        </div>
    </div>
</body>
</html>
