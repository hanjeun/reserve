# 기존 운영 DB를 재현할 때는 이미지·볼륨·네트워크·포트·보호 설정을 실제 컨테이너와 대조한다.
# 볼륨 이름이 다르면 빈 DB가 생성되므로 현재 백업과 복구 경로를 먼저 확보한다.
# 비밀번호가 포함되는 전체 컨테이너 환경은 출력하지 않는다.

services:
  mysql:
    # 데이터 디렉터리 호환성을 위해 실제 운영 이미지와 버전을 맞춘다.
    image: mysql:8.0
    container_name: mysql

    # 앱은 내부 네트워크로 연결하며 호스트 점검용 포트는 loopback에만 연다.
    ports:
      - "127.0.0.1:3306:3306"

    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=reserve
      - TZ=Asia/Seoul

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 느린 쿼리는 기존 로그 수집 경로에 기록한다.
      - --slow-query-log=ON
      - --slow-query-log-file=/var/log/reserve/mysql-slow.log
      - --long-query-time=2

    volumes:
      # 실제 데이터 볼륨의 이름과 일치해야 한다.
      - mysql-data:/var/lib/mysql
      - /var/log/reserve:/var/log/reserve

    networks:
      - app-network

    restart: unless-stopped

    # 앱 컨테이너보다 먼저 준비되도록 헬스체크를 둔다.
    healthcheck:
      # 비밀번호를 프로세스 인자나 docker inspect 출력에 남기지 않고 컨테이너 환경으로만 전달한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h localhost --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  # 신규 서버에서는 자동 생성하되 기존 서버에서는 실제 볼륨 이름을 유지한다.
  mysql-data:

networks:
  app-network:
    external: true
