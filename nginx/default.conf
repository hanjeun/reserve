# ── Rate Limiting: IP당 요청 제한 ──────────────────────────────────
# api_zone : API 엔드포인트 20요청/초 (burst 40 = 일시적 사용량 허용)
# static_zone: SPA 정적 파일 80요청/초 (burst 120)
limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=static_zone:10m rate=80r/s;
limit_req_zone $binary_remote_addr zone=csp_zone:1m     rate=2r/s;

# 연결 수 제한: IP당 동시 연결 최대 50개
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# 지연 원인을 구분하되 IP·쿼리·동적 ID·쿠키·토큰·요청/응답 본문은 기록하지 않는다.
map $uri $reserve_log_route {
    default                         "spa";
    ~^/assets/                      "asset";
    ~^/api/stores/[0-9]+             "store_detail";
    ~^/api/stores                    "store_list";
    ~^/api/chat                      "chat";
    ~^/api/                         "api_other";
    /actuator/health                "health";
}
log_format reserve_timing escape=json
    '{"time":"$msec","route":"$reserve_log_route","method":"$request_method",'
    '"status":$status,"request_time":"$request_time",'
    '"upstream_connect_time":"$upstream_connect_time","upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time","cache":"$upstream_cache_status"}';

# ── 검색 색인 정책: JS 를 실행하지 않는 크롤러를 위한 방어선 ─────────────────
# SPA 는 라우트가 바뀔 때 <meta name="robots"> 를 자바스크립트로 고쳐 쓴다
# (frontend/src/hooks/useRouteSeo.js). 그런데 nginx 는 어떤 경로를 요청받든 똑같은
# index.html 을 내려주고, 그 원본에는 robots: index, follow 가 박혀 있다.
# 즉 JS 를 실행하지 않는 크롤러(네이버 일부 수집기 포함)에게는 /login, /signup,
# /my-page, /payment/result 까지 전부 "색인해도 되는 페이지"로 보인다.
# 실제로 검색 결과에 로그인·회원가입 같은 알맹이 없는 항목이 잡혀 있었다.
#
# 그래서 헤더로 한 번 더 막는다. X-Robots-Tag 는 HTML 을 파싱하지 않아도 읽히므로
# JS 실행 여부와 무관하게 적용된다.
#
# ★ 색인 대상 경로 목록은 useRouteSeo.js 의 INDEXABLE_PATHS 및 백엔드 sitemap 정책과
#   **반드시 같은 집합**이어야 한다. 한 곳만 고치면 sitemap 에는 있는데 헤더로는
#   막히는(또는 그 반대) 모순이 생겨 색인이 통째로 흔들린다. 셋을 같이 고칠 것.
#
# 값이 빈 문자열이면 nginx 는 그 add_header 를 아예 붙이지 않는다 —
# 색인 대상 경로에는 헤더가 나가지 않는다. (nginx 1.24 로 실제 응답 확인함)
#
# ★★ $uri 가 아니라 $request_uri 를 봐야 한다 ★★
# SPA 는 `try_files $uri $uri/ /index.html` 로 모든 경로를 index.html 로 **내부 리다이렉트**한다.
# $uri 는 그 과정에서 바뀌므로, add_header 가 평가되는 시점에는 어떤 주소로 들어왔든
# 항상 "/index.html" 이다. 즉 $uri 로 매핑하면 /, /stores, /store/42, /terms, /privacy, /operation-guide 까지
# 전부 default 로 떨어져 **공개 페이지 전체에 noindex 가 붙는다.**
# (2026-09-03 nginx 1.24 로 재현 확인: $uri 판은 공개 경로 전부 noindex 였다)
# $request_uri 는 클라이언트가 보낸 원본 요청 그대로라 내부 리다이렉트에 영향받지 않는다.
# 대신 쿼리스트링이 붙어 오므로 정규식에서 (\?.*)? 로 함께 받아준다.
#
# ★ 이 목록은 useRouteSeo.js 의 INDEXABLE_PATHS 및 백엔드 sitemap 정책과
#   반드시 같은 집합이어야 한다(위 문단 참고).
map $request_uri $reserve_robots_tag {
    default                            "noindex, nofollow";
    "~^/(\?.*)?$"                      "";
    "~^/stores/?(\?.*)?$"              "";
    "~^/store/[0-9]+/?(\?.*)?$"        "";
    "~^/terms/?(\?.*)?$"               "";
    "~^/privacy/?(\?.*)?$"             "";
    "~^/content-sources/?(\?.*)?$"      "";
    "~^/operation-guide/?(\?.*)?$"     "";
}

# SPA 원본 index.html의 canonical은 홈으로 고정돼 있다. Google이 JS 렌더링 전에 원본을
# 평가해 /stores·/store/{id}까지 홈의 대체 페이지로 묶지 않도록, HTML을 내보내는 시점에
# 공개 경로의 canonical·제목·설명을 먼저 정확한 값으로 바꾼다. 클라이언트의 useRouteSeo는
# 화면 전환 뒤에도 같은 값을 유지하는 두 번째 관문이다.
#
# ★★ 빈 값(색인 대상)을 정규식 "~^$" 로 잡으면 안 된다 (2026-09-28 운영 사고).
#   nginx map 은 값이 빈 문자열이면 정규식 항목을 아예 평가하지 않는다(ngx_http_map_find 의 `if (len && nregex)`).
#   그래서 "~^$" 는 영원히 안 맞고 default(noindex)로 떨어져 /, /stores, /store/{id} 까지 원본 HTML 에
#   noindex 가 박혔다 → Google Search Console "'noindex' 태그에 의해 제외됨". JS 가 나중에 index 로 바꿔도
#   Google 은 렌더 전에 본 noindex 를 따른다. 빈 값을 조건으로 쓰지 말고, 막을 값만 정확히 적고 나머지를 default 로 둔다.
#   (컨테이너 nginx 1.24 로 옛 설정 noindex / 새 설정 index 재현 확인)
map $reserve_robots_tag $reserve_robots_meta {
    default                             "index, follow";
    "noindex, nofollow"                 "noindex, nofollow";
}

map $request_uri $reserve_canonical_url {
    default                             "https://reserve.it.kr/";
    "~^/(\?.*)?$"                       "https://reserve.it.kr/";
    "~^/stores/?(\?.*)?$"               "https://reserve.it.kr/stores";
    "~^/store/(?<reserve_store_id>[0-9]+)/?(\?.*)?$" "https://reserve.it.kr/store/$reserve_store_id";
    "~^/terms/?(\?.*)?$"                "https://reserve.it.kr/terms";
    "~^/privacy/?(\?.*)?$"              "https://reserve.it.kr/privacy";
    "~^/content-sources/?(\?.*)?$"      "https://reserve.it.kr/content-sources";
    "~^/operation-guide/?(\?.*)?$"      "https://reserve.it.kr/operation-guide";
}

map $request_uri $reserve_page_title {
    default                             "RESERVE | 예약이 필요한 순간";
    "~^/stores/?(\?.*)?$"               "가게 목록 | RESERVE";
    "~^/store/[0-9]+/?(\?.*)?$"         "가게 상세 | RESERVE";
    "~^/terms/?(\?.*)?$"                "서비스 이용약관 | RESERVE";
    "~^/privacy/?(\?.*)?$"              "개인정보 처리방침 | RESERVE";
    "~^/content-sources/?(\?.*)?$"      "콘텐츠 출처·권리 안내 | RESERVE";
    "~^/operation-guide/?(\?.*)?$"      "운영 안내 | RESERVE";
}

map $request_uri $reserve_page_description {
    default                             "필라테스 스튜디오부터 헤어샵, 병원까지 — 예약이 필요한 순간, RESERVE가 가장 빠르게 도와드립니다.";
    "~^/stores/?(\?.*)?$"               "원하는 조건으로 최고의 가게를 찾아보세요. RESERVE에서 다양한 업종을 간편하게 예약할 수 있습니다.";
    "~^/store/[0-9]+/?(\?.*)?$"         "가게 정보와 예약 가능 시간을 확인하고 RESERVE에서 예약하세요.";
    "~^/terms/?(\?.*)?$"                "RESERVE 서비스 이용약관 — 회원 자격, 예약과 결제, 취소·환불, 책임 범위를 안내합니다.";
    "~^/privacy/?(\?.*)?$"              "RESERVE 개인정보 처리방침 — 수집하는 항목, 이용 목적, 보관 기간, 파기 절차와 이용자 권리를 안내합니다.";
    "~^/content-sources/?(\?.*)?$"      "RESERVE에서 사용하는 콘텐츠의 출처와 권리 정보를 안내합니다.";
    "~^/operation-guide/?(\?.*)?$"      "RESERVE에서 가게를 탐색하고 예약을 확인하거나 가게를 운영하는 기본 흐름을 안내합니다.";
}

upstream blue {
    server PRIVATE_IP:8080;
}
upstream green {
    server PRIVATE_IP:8081;
}
server {
    listen 80;
    listen [::]:80;
    server_name reserve.it.kr www.reserve.it.kr;
    access_log /var/log/nginx/access.log reserve_timing;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://reserve.it.kr$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reserve.it.kr www.reserve.it.kr;
    ssl_certificate /etc/letsencrypt/live/reserve.it.kr/fullchain.pem;
    access_log /var/log/nginx/access.log reserve_timing;
    ssl_certificate_key /etc/letsencrypt/live/reserve.it.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 배포는 releases/<commit-sha>를 만든 뒤 current symlink를 원자적으로 교체한다.
    # 정적 파일을 먼저 지우던 예전 방식과 달리 요청 중간에 빈 디렉터리가 노출되지 않는다.
    root /usr/share/nginx/html/current;
    index index.html;

    # ── 전송 압축 (2026-09) ───────────────────────────────────────────────────
    # 그동안 gzip 이 꺼져 있어 메인 JS 번들(약 570KB)이 압축 없이 그대로 내려갔다.
    # 켜면 약 190KB 로 줄어 첫 방문과 배포 직후 재방문(새 해시 청크)의 로딩 시간이 준다.
    # server 레벨에 한 번만 두면 아래 모든 location(정적 파일·API JSON·sitemap)에 적용된다.
    #   gzip_types      text/html 은 기본 포함이라 적지 않는다. 이미지·woff2 는 이미 압축된
    #                   형식이라 다시 압축해도 크기가 거의 안 줄고 CPU 만 쓴다 — 목록에서 뺀다.
    #   gzip_min_length 1KB 미만은 헤더 오버헤드 때문에 오히려 손해라 그대로 보낸다.
    #   gzip_comp_level 5 는 크기·CPU 균형점. 9 로 올려도 몇 % 더 줄 뿐이다.
    #   gzip_vary       Vary: Accept-Encoding 을 붙여 중간 캐시가 압축본/원본을 섞지 않게 한다.
    #   gzip_proxied    요청에 Via 헤더가 붙어 오는 경우(통신사 프록시 등)에도 압축한다.
    #
    # BREACH(압축 크기로 응답 속 비밀을 추측하는 공격)를 검토했다. 이 공격은 공격자가
    # 피해자 브라우저로 쿠키가 실린 요청을 대량으로 보내게 만들어야 성립한다. 인증 쿠키가
    # SameSite=Lax(CookieUtil)라 다른 사이트의 fetch·img·script 요청에는 쿠키가 실리지 않고,
    # 토큰은 HttpOnly 쿠키로만 오가며 응답 본문에 공격자 입력과 함께 담기지 않는다.
    # → API JSON 도 압축한다. SameSite 를 None 으로 바꾸게 되면 이 판단을 다시 할 것.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    # ── 보안 헤더에 대한 주의 (아래 location마다 반복되는 이유) ────────────────
    # nginx의 add_header는 상속이 아니라 "현재 레벨에 add_header가 하나라도 있으면
    # 상위 레벨의 add_header를 전부 무시"하는 방식이다. location / 과 /assets/ 는 이미
    # Cache-Control용 add_header를 갖고 있어서, server 레벨에 보안 헤더를 한 번만 적으면
    # 정작 HTML을 내려주는 그 두 곳에서 헤더가 통째로 사라진다.
    # → location마다 반복하는 것이 맞다.
    # 별도 .inc 파일로 빼지 않은 이유: CI가 nginx/default.conf 한 파일만 scp한다(CICD.yml).
    #
    # ── CSP (Content-Security-Policy) ─────────────────────────────────────────
    # 2026-08: Report-Only 로 도입했다. 아래 location / 에만 붙인다 —
    # CSP 는 "문서"에 적용되는 정책이라 HTML 을 내려주는 곳에만 의미가 있고,
    # /api/(JSON)·/assets/(JS·CSS)에 붙여봐야 아무것도 통제하지 못한다.
    #
    # ★ Report-Only 인 동안에는 아무것도 차단하지 않는다. 위반이 있으면 브라우저 콘솔에만
    #   "[Report Only] Refused to ..." 로 찍힌다. 운영에서 며칠 관측해 콘솔이 깨끗하면
    #   헤더 이름에서 -Report-Only 만 떼어 강제로 전환한다. 값은 그대로 둔다.
    #
    # 각 출처의 근거 (전부 실제 코드에서 확인함):
    #   script-src  cdn.portone.io      → 포트원 V2 결제 SDK.
    #                                     ★ 2026-08-10 V1(cdn.iamport.kr) → V2 전환.
    #                                     npm @portone/browser-sdk 를 쓰지만 그건 얇은 로더라
    #                                     런타임에 이 도메인의 스크립트를 주입한다 — 번들에 들어가지 않으므로
    #                                     여기서 빼면 결제창이 아예 안 뜬다.
    #               dapi.kakao.com      → KakaoMap이 뷰포트 진입 시 지연 로드하는 카카오맵 SDK
    #               *.daumcdn.net       → 카카오맵 SDK 가 런타임에 추가로 불러오는 스크립트
    #   style-src   'unsafe-inline'     → ★ 제거 불가. antd 6(cssinjs)이 런타임에 style 태그를
    #                                     주입하는 구조라 빼면 화면이 통째로 무스타일이 된다.
    #                                     nonce 로 대체하려면 nginx 가 요청마다 nonce 를 만들고
    #                                     ConfigProvider csp 로 넘겨야 하는데,
    #                                     정적 파일 서빙 구조에서는 불가능하다.
    #   font-src    'self' data:        → Pretendard 는 npm 번들(= self), SUITE 는 /fonts/ 자체 호스팅.
    #                                     외부 폰트 CDN 을 쓰지 않으므로 여기서 웹폰트가 깨질 일은 없다.
    #   img-src     blob:               → 이미지 미리보기(rc-image)가 blob URL 을 만든다
    #               cdn.reserve.it.kr   → CloudFront (가게·프로필 이미지)
    #               *.daumcdn.net       → 카카오맵 타일
    #               placehold.co        → utils/image.js 의 이미지 없음 폴백
    #               images.unsplash.com → Home.data.js 의 홈 화면 샘플 이미지
    #   connect-src *.sentry.io         → Sentry 에러·트레이스 전송 (리전이 us/de 로 갈려 와일드카드)
    #               *.portone.io        → V2 SDK 가 결제 준비·상태 조회로 호출한다
    #               *.iamport.kr        → 포트원이 아직 이 도메인으로 일부 요청을 보낸다(운영에서 위반 관측됨)
    #   worker-src  blob:               → Sentry Replay 가 워커를 blob 으로 띄운다
    #   frame-src / form-action         → 포트원 결제창·카카오페이.
    #                                     ★ V2 부터 PC 카카오페이가 IFRAME 이다(V1 은 팝업이었다).
    #                                     즉 frame-src 가 이제 PC 결제의 필수 조건이다 — 빼면 결제창이 안 뜬다.
    #                                     모바일은 REDIRECTION 이라 form-action 쪽이 걸린다.
    #   frame-ancestors 'none'          → 위 X-Frame-Options DENY 와 같은 의미(CSP 쪽이 표준)
    #
    # 값을 여러 줄로 쪼개지 말 것. nginx 는 따옴표 안 개행을 허용하지만 이 파일은 CI 가
    # 그대로 scp 하므로 줄바꿈이 섞이면 진단이 어려워진다. 한 줄로 유지한다.
    # sitemap은 정적 파일보다 백엔드의 공개 가게 목록을 우선한다. 백엔드는 ACTIVE + 미삭제
    # 가게만 최대 50,000 URL 제한 안에서 반환하며 한 시간 캐시한다.
    location = /sitemap.xml {
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    # 공개 브라우저 진단 수집 경로는 일반 API보다 엄격하게 제한한다.
    location = /api/csp-reports {
        client_max_body_size 32k;
        limit_req zone=csp_zone burst=10 nodelay;
        limit_req_status 429;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    # 원본 HTML과 공유 메타를 같은 공개 가게 권한으로 내려준다.
    location ~ ^/store/(?<public_store_id>[0-9]+)/?$ {
        limit_req zone=api_zone burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_zone 50;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.portone.io https://dapi.kakao.com https://*.daumcdn.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.reserve.it.kr https://*.daumcdn.net https://*.kakaocdn.net https://placehold.co https://images.unsplash.com; connect-src 'self' https://*.sentry.io https://dapi.kakao.com https://*.daumcdn.net https://cdn.reserve.it.kr https://*.portone.io https://*.iamport.kr; worker-src 'self' blob:; frame-src 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; form-action 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri /api/csp-reports" always;
        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url/api/public/store-pages/$public_store_id;
        proxy_set_header Accept "text/html";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        # API 요청 제한: 20r/s, burst 40 초과 시 503 대신 429 반환
        limit_req zone=api_zone burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_zone 50;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /oauth2/authorization/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /login/oauth2/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location / {
        # SPA 정적 파일 요청 제한
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;

        # 캐시 전략 (2026-07): index.html은 항상 재검증해서 배포 직후 새 청크가 반영되게 한다.
        # (해시가 붙은 JS/CSS는 아래 /assets/ 블록에서 영구 캐시)
        add_header Cache-Control "no-cache";

        # ★ HTML을 내려주는 곳이라 보안 헤더가 가장 필요한 자리다.
        #   위 Cache-Control add_header 때문에 server 레벨 헤더는 여기서 전부 무시된다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        # 검색 색인 정책 — 위 map $reserve_robots_tag 주석 참조.
        # 색인 대상 경로에서는 값이 비어 헤더가 붙지 않고, 나머지 경로에만 noindex 가 나간다.
        add_header X-Robots-Tag $reserve_robots_tag always;

        # 크롤러가 JS를 실행하기 전에도 요청 경로와 일치하는 SEO 메타를 받는다.
        # ngx_http_sub_module은 replacement의 변수를 지원한다. 배포 단계에서 모듈 포함 여부를
        # 먼저 확인한 뒤 이 설정을 복사한다. 원본 index.html과 변환된 응답이 같은 검증자를
        # 공유하지 않도록 sub_filter_last_modified는 기본값(off)을 유지한다.
        sub_filter_once on;
        sub_filter '<title>RESERVE | 예약이 필요한 순간</title>' '<title>$reserve_page_title</title>';
        sub_filter '<meta name="description" content="필라테스 스튜디오부터 헤어샵, 병원까지 — 예약이 필요한 순간, RESERVE가 가장 빠르게 도와드립니다." />' '<meta name="description" content="$reserve_page_description" />';
        sub_filter '<meta name="robots" content="index, follow" />' '<meta name="robots" content="$reserve_robots_meta" />';
        sub_filter '<link rel="canonical" href="https://reserve.it.kr" />' '<link rel="canonical" href="$reserve_canonical_url" />';
        sub_filter '<meta property="og:url" content="https://reserve.it.kr" />' '<meta property="og:url" content="$reserve_canonical_url" />';

        # CSP — 위 주석의 "CSP" 절 참조. 지금은 Report-Only(차단 없음, 콘솔 경고만).
        # 운영에서 위반 0건을 확인한 뒤 헤더명에서 -Report-Only 를 떼면 강제된다.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.portone.io https://dapi.kakao.com https://*.daumcdn.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.reserve.it.kr https://*.daumcdn.net https://*.kakaocdn.net https://placehold.co https://images.unsplash.com; connect-src 'self' https://*.sentry.io https://dapi.kakao.com https://*.daumcdn.net https://cdn.reserve.it.kr https://*.portone.io https://*.iamport.kr; worker-src 'self' blob:; frame-src 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; form-action 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri /api/csp-reports" always;

        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힐 빌드 산출물(Vite는 dist/assets/에 main.<hash>.js 처럼 생성) —
    # 내용이 바뀌면 파일명 자체가 바뀌므로 브라우저/CDN에 1년 immutable 캐시해도 안전하다.
    # 재방문 시 이 파일들은 서버에 요청 없이 로컬 캐시에서 바로 로드된다.
    location ^~ /assets/ {
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }

    # 해시 없는 public 폰트·이미지는 immutable로 고정하지 않는다. 파일이 바뀌면 재검증한다.
    location ~* \.(?:woff2?|png|jpe?g|webp|gif|svg|ico)$ {
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name grafana.reserve.it.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://grafana.reserve.it.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name grafana.reserve.it.kr;
    ssl_certificate /etc/letsencrypt/live/grafana.reserve.it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.reserve.it.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Grafana는 자체 헤더를 붙이지만 HSTS·nosniff는 없다. X-Frame-Options는 넣지 않는다 —
        # Grafana 내부에 iframe 패널을 쓰는 대시보드가 있으면 깨진다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
