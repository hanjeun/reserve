# ── Rate Limiting: IP당 요청 제한 ──────────────────────────────────
# api_zone : API 엔드포인트 20요청/초 (burst 40 = 일시적 사용량 허용)
# static_zone: SPA 정적 파일 80요청/초 (burst 120)
limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=static_zone:10m rate=80r/s;

# 연결 수 제한: IP당 동시 연결 최대 50개
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

upstream blue {
    server PRIVATE_IP:8080;
}
upstream green {
    server PRIVATE_IP:8081;
}
server {
    listen 80;
    listen [::]:80;
    server_name reserve.it.kr www.reserve.it.kr;
    return 301 https://reserve.it.kr$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reserve.it.kr www.reserve.it.kr;
    ssl_certificate /etc/letsencrypt/live/reserve.it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reserve.it.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    # ── 보안 헤더에 대한 주의 (아래 location마다 반복되는 이유) ────────────────
    # nginx의 add_header는 상속이 아니라 "현재 레벨에 add_header가 하나라도 있으면
    # 상위 레벨의 add_header를 전부 무시"하는 방식이다. location / 과 /assets/ 는 이미
    # Cache-Control용 add_header를 갖고 있어서, server 레벨에 보안 헤더를 한 번만 적으면
    # 정작 HTML을 내려주는 그 두 곳에서 헤더가 통째로 사라진다.
    # → location마다 반복하는 것이 맞다.
    # 별도 .inc 파일로 빼지 않은 이유: CI가 nginx/default.conf 한 파일만 scp한다(CICD.yml).
    #
    # ── CSP (Content-Security-Policy) ─────────────────────────────────────────
    # 2026-08: Report-Only 로 도입했다. 아래 location / 에만 붙인다 —
    # CSP 는 "문서"에 적용되는 정책이라 HTML 을 내려주는 곳에만 의미가 있고,
    # /api/(JSON)·/assets/(JS·CSS)에 붙여봐야 아무것도 통제하지 못한다.
    #
    # ★ Report-Only 인 동안에는 아무것도 차단하지 않는다. 위반이 있으면 브라우저 콘솔에만
    #   "[Report Only] Refused to ..." 로 찍힌다. 운영에서 며칠 관측해 콘솔이 깨끗하면
    #   헤더 이름에서 -Report-Only 만 떼어 강제로 전환한다. 값은 그대로 둔다.
    #
    # 각 출처의 근거 (전부 실제 코드에서 확인함):
    #   script-src  cdn.portone.io      → 포트원 V2 결제 SDK.
    #                                     ★ 2026-08-10 V1(cdn.iamport.kr) → V2 전환.
    #                                     npm @portone/browser-sdk 를 쓰지만 그건 얇은 로더라
    #                                     런타임에 이 도메인의 스크립트를 주입한다 — 번들에 들어가지 않으므로
    #                                     여기서 빼면 결제창이 아예 안 뜬다.
    #               dapi.kakao.com      → index.html 의 카카오맵 SDK
    #               *.daumcdn.net       → 카카오맵 SDK 가 런타임에 추가로 불러오는 스크립트
    #   style-src   'unsafe-inline'     → ★ 제거 불가. antd 6(cssinjs)이 런타임에 style 태그를
    #                                     주입하는 구조라 빼면 화면이 통째로 무스타일이 된다.
    #                                     nonce 로 대체하려면 nginx 가 요청마다 nonce 를 만들고
    #                                     ConfigProvider csp 로 넘겨야 하는데,
    #                                     정적 파일 서빙 구조에서는 불가능하다.
    #   font-src    'self' data:        → Pretendard 는 npm 번들(= self), SUITE 는 /fonts/ 자체 호스팅.
    #                                     외부 폰트 CDN 을 쓰지 않으므로 여기서 웹폰트가 깨질 일은 없다.
    #   img-src     blob:               → 이미지 미리보기(rc-image)가 blob URL 을 만든다
    #               cdn.reserve.it.kr   → CloudFront (가게·프로필 이미지)
    #               *.daumcdn.net       → 카카오맵 타일
    #               placehold.co        → utils/image.js 의 이미지 없음 폴백
    #               images.unsplash.com → Home.data.js 의 홈 화면 샘플 이미지
    #   connect-src *.sentry.io         → Sentry 에러·트레이스 전송 (리전이 us/de 로 갈려 와일드카드)
    #               *.portone.io        → V2 SDK 가 결제 준비·상태 조회로 호출한다
    #               *.iamport.kr        → 포트원이 아직 이 도메인으로 일부 요청을 보낸다(운영에서 위반 관측됨)
    #   worker-src  blob:               → Sentry Replay 가 워커를 blob 으로 띄운다
    #   frame-src / form-action         → 포트원 결제창·카카오페이.
    #                                     ★ V2 부터 PC 카카오페이가 IFRAME 이다(V1 은 팝업이었다).
    #                                     즉 frame-src 가 이제 PC 결제의 필수 조건이다 — 빼면 결제창이 안 뜬다.
    #                                     모바일은 REDIRECTION 이라 form-action 쪽이 걸린다.
    #   frame-ancestors 'none'          → 위 X-Frame-Options DENY 와 같은 의미(CSP 쪽이 표준)
    #
    # 값을 여러 줄로 쪼개지 말 것. nginx 는 따옴표 안 개행을 허용하지만 이 파일은 CI 가
    # 그대로 scp 하므로 줄바꿈이 섞이면 진단이 어려워진다. 한 줄로 유지한다.
    location /api/ {
        # API 요청 제한: 20r/s, burst 40 초과 시 503 대신 429 반환
        limit_req zone=api_zone burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_zone 50;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /oauth2/authorization/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /login/oauth2/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location / {
        # SPA 정적 파일 요청 제한
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;

        # 캐시 전략 (2026-07): index.html은 항상 재검증해서 배포 직후 새 청크가 반영되게 한다.
        # (해시가 붙은 JS/CSS는 아래 /assets/ 블록에서 영구 캐시)
        add_header Cache-Control "no-cache";

        # ★ HTML을 내려주는 곳이라 보안 헤더가 가장 필요한 자리다.
        #   위 Cache-Control add_header 때문에 server 레벨 헤더는 여기서 전부 무시된다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        # CSP — 위 주석의 "CSP" 절 참조. 지금은 Report-Only(차단 없음, 콘솔 경고만).
        # 운영에서 위반 0건을 확인한 뒤 헤더명에서 -Report-Only 를 떼면 강제된다.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.portone.io https://dapi.kakao.com https://*.daumcdn.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.reserve.it.kr https://*.daumcdn.net https://*.kakaocdn.net https://placehold.co https://images.unsplash.com; connect-src 'self' https://*.sentry.io https://dapi.kakao.com https://*.daumcdn.net https://cdn.reserve.it.kr https://*.portone.io https://*.iamport.kr; worker-src 'self' blob:; frame-src 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; form-action 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힐 빌드 산출물(Vite는 dist/assets/에 main.<hash>.js 처럼 생성) —
    # 내용이 바뀌면 파일명 자체가 바뀌므로 브라우저/CDN에 1년 immutable 캐시해도 안전하다.
    # 재방문 시 이 파일들은 서버에 요청 없이 로컬 캐시에서 바로 로드된다.
    location /assets/ {
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name grafana.reserve.it.kr;
    return 301 https://grafana.reserve.it.kr$request_uri;
}

server {
    listen 443 ssl;
    server_name grafana.reserve.it.kr;
    ssl_certificate /etc/letsencrypt/live/grafana.reserve.it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.reserve.it.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Grafana는 자체 헤더를 붙이지만 HSTS·nosniff는 없다. X-Frame-Options는 넣지 않는다 —
        # Grafana 내부에 iframe 패널을 쓰는 대시보드가 있으면 깨진다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
