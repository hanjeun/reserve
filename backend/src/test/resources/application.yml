# 테스트용 설정
spring:
  application:
    name: reserve-test

  # 테스트용 H2 데이터베이스
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # OAuth2 테스트 설정 (비활성화)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            scope: name, email
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            scope: profile_nickname, account_email
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# HealthCheckController / CookieUtil 등이 기대하는 환경 구분값 (일부는 기본값 없음)
server:
  port: 8080
  serverAddress: localhost
  env: test
serverName: test_server

# JWT 테스트 설정 (64자 이상의 키 필요)
jwt:
  issuer: test-issuer
  secret-key: test-secret-key-for-jwt-authentication-that-is-at-least-64-characters-long-for-hmac-sha256
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 7

# 메일 테스트 설정 (MailConfig가 기대하는 전체 키 — application-common.yml과 동일하게 맞춰야 함, 기본값 없음)
mail:
  host: smtp.test.com
  port: 465
  username: test@test.com
  password: test-password
  properties:
    mail:
      smtp:
        auth: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# PortOne 테스트 설정
portone:
  v2-secret: test-v2-secret
  store-id: test-store-id
  # 서명 검증 테스트용 고정 시크릿. whsec_ 접두사 뒤는 **유효한 base64** 여야 한다 —
  # 아니면 검증기가 키를 못 만들고 모든 웹훅을 거부해서, 테스트가 "항상 401" 로 통과해버린다
  # (거부를 기대하는 테스트만 초록이 되고 정상 서명 테스트는 원인 모를 실패가 된다).
  webhook-secret: whsec_dGVzdC13ZWJob29rLXNlY3JldC0xMjM0NTY3OA==

# Kakao REST API (주소 검색용)
kakao:
  rest-api-key: test-kakao-rest-api-key

# S3 테스트 설정 (FileStorageService가 기대하는 중첩 구조 — application-secret.yml과 동일하게 맞춰야 함)
s3:
  bucket: test-bucket
  cloudfront: test.cloudfront.net
  region: ap-northeast-2
  access-key: test-access-key
  secret-key: test-secret-key

# ★ 유출 비밀번호 검사를 테스트에서만 끈다.
# 켜두면 테스트가 외부 네트워크(api.pwnedpasswords.com)에 의존하게 된다 —
# 코드가 fail-open 이라 테스트가 "깨지진" 않지만, 오프라인 환경에선 검사마다
# 타임아웃 3초를 그대로 기다리고, 테스트 결과가 외부 서비스 상태에 따라 흔들린다.
# 운영·로컬은 코드 기본값(true)을 그대로 쓴다.
security:
  pwned-password:
    enabled: false

# DDL 생성 실패를 보이게 한다 (2026-08-16 추가).
#
# Hibernate 는 CREATE TABLE 이 실패해도 **로그만 남기고 계속 진행한다.** 그래서
# columnDefinition = "TINYINT(1) DEFAULT 0" 처럼 MySQL 전용 문법이 들어 있으면
# H2 에서 그 테이블만 조용히 안 만들어지고, 나중에 그 테이블을 쓰는 테스트가
# "Table not found" 로 죽는다 — 원인이 엔티티에 있는데 증상은 테스트에 나타난다.
# 실제로 member·password_reset_token 두 테이블이 이 상태로 방치돼 있었다.
logging:
  level:
    org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl: DEBUG
