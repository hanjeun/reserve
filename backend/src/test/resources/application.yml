# 테스트용 설정
spring:
  application:
    name: reserve-test

  # 테스트용 H2 데이터베이스
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # OAuth2 테스트 설정 (비활성화)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: email, profile
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            scope: name, email
            client-name: Naver
            authorization-grant-type: authorization_code
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            scope: profile_nickname, account_email
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# JWT 테스트 설정 (64자 이상의 키 필요)
jwt:
  issuer: test-issuer
  secret-key: test-secret-key-for-jwt-authentication-that-is-at-least-64-characters-long-for-hmac-sha256
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 7

# 메일 테스트 설정
mail:
  username: test@test.com
  password: test-password

# PortOne 테스트 설정
portone:
  imp-key: test-imp-key
  imp-secret: test-imp-secret
  imp-code: test-imp-code

# S3 테스트 설정
S3_BUCKET_NAME: test-bucket
CLOUDFRONT_DOMAIN: test.cloudfront.net
AWS_REGION: ap-northeast-2
AWS_ACCESS_KEY_ID: test-access-key
AWS_SECRET_ACCESS_KEY: test-secret-key
