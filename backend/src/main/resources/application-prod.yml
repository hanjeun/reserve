# ============================================
# 배포 환경 공통 설정 (Blue/Green 공통)
# ============================================

spring:
  config:
    activate:
      on-profile: prod

  # Docker MySQL 연결
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  # OAuth2 Redirect URI (배포 도메인)
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: https://reserve.it.kr/login/oauth2/code/google
          naver:
            redirect-uri: https://reserve.it.kr/login/oauth2/code/naver
          kakao:
            redirect-uri: https://reserve.it.kr/login/oauth2/code/kakao

# 서버 공통 설정 (포트는 blue/green에서 개별 설정)
server:
  serverAddress: reserve.it.kr
  env: prod

# 프론트엔드 URL
app:
  frontend-url: https://reserve.it.kr

# CORS 허용 출처 (쉼표 구분 — SecurityConfig의 @Value List<String> 바인딩)
# 운영은 자기 도메인 하나뿐이다. localhost·ngrok은 local.yml에만 둔다.
cors:
  allowed-origins: "https://reserve.it.kr"

# 가게 검색을 MySQL FULLTEXT(ngram)로 처리한다.
#
# ★ 선행 조건: docs/technical/manual-ddl.md 의 FULLTEXT 인덱스를 **먼저 적용**해야 한다.
#   ddl-auto: update 는 FULLTEXT 인덱스를 만들지 못한다. 인덱스 없이 이 값을 true로 두면
#   검색할 때마다 "Can't find FULLTEXT index matching the column list" 로 실패한다.
#   → 인덱스를 적용하기 전에는 이 줄을 주석 처리해 두는 게 안전하다.
#
# false(기본값)면 기존 LIKE '%kw%' 경로로 폴백한다. 동작은 같고 느릴 뿐이다.
# test(H2)·local 은 MATCH...AGAINST 문법이 없거나 인덱스가 없으므로 기본값 false를 유지한다.
#
# ★★ 2026-08-05 — 일부러 켜지 않은 상태로 둔다(주석).
#   `docs/technical/manual-ddl.md` 의 적용 이력이 아직 "(미적용)" 이다.
#   인덱스 없이 이 값을 true 로 두면 가게 검색이 매번
#   "Can't find FULLTEXT index matching the column list" 로 실패한다 = 검색 전면 500.
#   기본값(false)이면 기존 LIKE 경로로 폴백하므로 느릴 뿐 동작은 한다.
#   → **DDL 적용 → 이력 표 기록 → 그 다음에 아래 두 줄의 주석을 푼다.** 순서를 바꾸지 말 것.
#
# search:
#   store:
#     fulltext-enabled: true

# 운영 환경 로깅 — DEBUG 로그 비활성화
logging:
  level:
    root: WARN
    kr.it.reserve: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
