version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["chore", "dependencies"]
    # 호환 의존성은 함께 갱신한다.
    groups:
      # ESLint 코어와 플러그인의 호환 버전을 함께 유지한다.
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "eslint-config-*"]
      # 오류 수집기와 Replay는 같은 버전으로 갱신한다.
      sentry:
        patterns: ["@sentry/*"]
      # 주 버전 변경은 묶지 않는다.
      frontend-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["chore", "dependencies"]
    # Spring Boot 지원 범위에 맞추며 업그레이드 시 함께 검토한다.
    ignore:
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["chore", "dependencies"]
    groups:
      actions:
        patterns: ["*"]
