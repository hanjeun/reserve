plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

// 의존성 잠금으로 재현 가능한 버전을 유지한다.
dependencyLocking {
    lockAllConfigurations()
}

group = 'kr.it.reserve'
// 프론트 package.json과 릴리스 버전을 맞춘다.

version = '2.16.0'
description = 'We are reserve'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// BOM에서 관리하지 않는 JJWT 버전을 한곳에서 지정한다.


ext {
    jjwtVersion = '0.13.0'
}

// Spring Boot BOM 이후의 호환 보안 패치를 지정한다.
ext['jackson-2-bom.version'] = '2.21.8'
// 2.4.240의 연결 종료 뒤 CHECK 제약 평가 오류를 피한다.
ext['h2.version'] = '2.5.252'

dependencies {

    implementation platform('software.amazon.awssdk:bom:2.56.0')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 결제·감사 JSON 계약을 유지하며 Jackson 3 전환을 분리한다.
    implementation 'org.springframework.boot:spring-boot-jackson2'
    implementation 'io.sentry:sentry-spring-boot-4-starter:8.61.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.yubico:webauthn-server-core:2.10.1'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    // Spring Boot BOM의 Jakarta 버전을 사용한다.

    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'


    implementation 'software.amazon.awssdk:s3'


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    // 모듈 사이의 순환 의존을 검사한다.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    

    runtimeOnly 'com.h2database:h2'
}

// 공개 가게 HTML은 동일 릴리스의 프론트 빌드와 묶는다.
tasks.named('processResources') {
    from('../frontend/dist/index.html') { into 'store-shell' }
}
tasks.named('bootJar') {
    doFirst {
        if (!file('../frontend/dist/index.html').isFile()) {
            throw new GradleException('Build the frontend before packaging store pages')
        }
    }
}

apply from: '../scripts/dependency-notices.gradle'


jar {
    enabled = false
}

// Windows 명령 길이 제한을 넘지 않도록 운영 도구 시험의 클래스 경로를 묶는다.
def toolTestClasspath = tasks.register('toolTestClasspath', Jar) {
    dependsOn tasks.named('testClasses')
    archiveFileName = 'tool-test-classpath.jar'
    destinationDirectory = layout.buildDirectory.dir('tool-test')
    inputs.files(sourceSets.test.runtimeClasspath).withPropertyName('toolClasspath')
    doFirst {
        manifest.attributes('Class-Path': sourceSets.test.runtimeClasspath.files.collect { it.toURI().toString() }.join(' '))
    }
}

tasks.named('test') {
    dependsOn toolTestClasspath
    useJUnitPlatform()
    // 워커를 재사용하는 동안 쌓인 Spring·ArchUnit 상태를 주기적으로 해제한다.
    forkEvery = 50
    systemProperty 'reserve.toolTestClasspath', toolTestClasspath.get().archiveFile.get().asFile.absolutePath
}

// 운영 도구를 격리된 읽기 전용 테스트에서 검사한다.
tasks.named('compileTestJava') {
    source '../scripts/java/kr/it/reserve/tools/PrepareAdmissionCampaign.java'
    source '../scripts/java/kr/it/reserve/tools/PrepareServiceAdmission.java'
    source '../scripts/tests/kr/it/reserve/tools/PrepareServiceAdmissionTest.java'
    source '../scripts/java/kr/it/reserve/tools/VerifyDatabaseSchema.java'
    source '../scripts/java/kr/it/reserve/tools/VerifyChatImageRecovery.java'
    source '../scripts/tests/kr/it/reserve/tools/VerifyChatImageRecoveryTest.java'
}
