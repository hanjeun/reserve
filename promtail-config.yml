server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 애플리케이션 로그 (Logback) + 백업 스크립트 로그(backup.log)
  - job_name: reserve
    static_configs:
      - targets:
          - localhost
        labels:
          job: reserve
          __path__: /var/log/reserve/*.log

  # nginx 접근/에러 로그.
  #
  # 이게 없으면 nginx가 막은 429(rate limit)·404·스캐닝 UA를 **전혀 볼 수 없다.**
  # 방어(limit_req 20r/s, limit_conn 50)는 돌고 있는데 그 기록이 Loki에 안 들어와서
  # "지금 공격을 받고 있는지"를 확인할 방법이 없었다.
  #
  # ⚠️ 이 job이 실제로 동작하려면 **서버에서 두 가지가 선행돼야 한다** (docs/technical/monitoring.md 참고):
  #   1) nginx 컨테이너가 로그를 진짜 파일로 남길 것.
  #      공식 nginx 이미지는 /var/log/nginx/access.log 를 /dev/stdout 으로 심볼릭 링크해 둔다
  #      → 파일이 없으므로 이 경로를 아무리 읽어도 0건이다.
  #      호스트 디렉토리를 nginxserver:/var/log/nginx 로 마운트해서 실제 파일로 남겨야 한다.
  #   2) promtail 컨테이너에 그 호스트 디렉토리를 read-only로 마운트할 것
  #      (docker-compose-monitoring.yml에 추가해 뒀다).
  #
  # 설정 후 확인: Grafana에서 `{job="nginx"}` 가 0건이면 위 1)이 안 된 것이다.
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
