# 로컬 개발 환경 전용 설정

spring:
  config:
    activate:
      on-profile: local
    import: optional:file:${user.home}/.codex/local-data/RESERVE/local.properties

  # 개발 도구 (로컬 전용)
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  # 로컬 MySQL 연결
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # 로컬 전용 계정은 다른 환경에 재사용하지 않는다. 비밀번호는 DB_PASSWORD_LOCAL로 재정의한다.
    password: ${DB_PASSWORD_LOCAL:1234}

  # 로컬 OAuth2 콜백 주소
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          naver:
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
          kakao:
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"

# 서버 설정
server:
  port: 8080
  serverAddress: localhost
  env: local

serverName: local_server

# 로컬 추가 로깅
logging:
  level:
    org.hibernate.SQL: DEBUG

# 운영 데이터와 분리하는 로컬 S3 접두사
s3:
  env-prefix: local

# 로컬 피드 사진은 전용 저장소에 암호문으로 보관한다. 키와 활성값은 Git 밖의 설정에 둔다.
FEED_INTERACTIONS_ENABLED: true
STORE_NEWS_ENABLED: true
feed:
  media:
    local-enabled: true
    local-directory: ${user.home}/.codex/local-data/RESERVE/feed-images

reserve:
  redis:
    host: 127.0.0.1

# 인증 쿠키가 개발 출처로 전달되지 않도록 localhost·ngrok은 로컬 프로파일에만 허용한다.
cors:
  allowed-origins: "http://localhost:5173,https://reserve.it.kr,https://slouching-blubber-worst.ngrok-free.dev"
