name: Sonar CI

# Static analysis is opt-in. Coverage targets do not trigger tests or block delivery.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Compile Java analysis inputs
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew classes testClasses --console=plain
      - name: Install frontend analysis tools
        working-directory: frontend
        run: npm ci
      - name: Analyze backend and frontend
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'SONAR_TOKEN is required'; exit 1; }
          ./gradlew -I ../scripts/sonar-ci.init.gradle sonar --console=plain
