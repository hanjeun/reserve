# 적용 전에 Promtail을 중지하고 읽기 위치를 보존하며 두 수집기를 동시에 기동하지 않는다.
# 기존 관측 구성과 함께 사용하고 nginxserver의 현재 로그 디렉터리를 대조한다.
# 운영 전환은 별도 승인 범위에서 수행한다.
services:
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      - /var/log/reserve:/var/log/reserve:ro
      - /var/log/metrics:/var/log/metrics:ro
      - ${RESERVE_NGINX_LOG_DIR:?set the current nginx Docker log directory}:/var/log/reserve-nginx:ro
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - promtail-positions:/tmp:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  alloy-data:
