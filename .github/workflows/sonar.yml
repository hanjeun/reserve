name: Sonar CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Enable after SONAR_TOKEN is registered and automatic analysis is disabled.
    # Fork code never receives the analysis credential.
    if: >-
      vars.SONAR_CI_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Compile Java analysis inputs
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew classes testClasses --console=plain
      - name: Analyze backend and frontend
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'SONAR_TOKEN is required'; exit 1; }
          ./gradlew -I ../scripts/sonar-ci.init.gradle sonar --console=plain
