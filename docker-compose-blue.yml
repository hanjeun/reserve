version: '3.8'
services:
  blue:
    container_name: blue
    # 배포는 커밋 SHA 태그를 명시하며, 값이 없으면 latest를 사용한다.
    image: ${DOCKERHUB_USERNAME}/reserve:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    # 저장 시각과 로그의 UTC 관례를 유지하며 KST 업무 판단은 ServiceTime에서 명시한다.
    environment:
      - SPRING_PROFILES_ACTIVE=blue
      - SERVER_ENV=blue
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://reserve.it.kr}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://reserve.it.kr}
      - APP_MARKETING_URL=${APP_MARKETING_URL:-https://reserve.it.kr}
      - APP_LEGACY_FRONTEND_URL=${APP_LEGACY_FRONTEND_URL:-}
      - JAVA_OPTS=-Xmx512m -Xms256m
      - RESERVE_MFA_ENABLED=${RESERVE_MFA_ENABLED:-false}
      - RESERVE_MFA_RP_ID=${RESERVE_MFA_RP_ID:-app.reserve.it.kr}
      - RESERVE_MFA_ORIGINS=${RESERVE_MFA_ORIGINS:-https://app.reserve.it.kr}
      - RESERVE_MFA_ENCRYPTION_KEY=${RESERVE_MFA_ENCRYPTION_KEY:-}
      - RESERVE_RESERVATION_AUTO_COMPLETION_ENABLED=${RESERVE_RESERVATION_AUTO_COMPLETION_ENABLED:-false}
      - RESERVE_SETTLEMENT_TEST_ENABLED=${RESERVE_SETTLEMENT_TEST_ENABLED:-false}
      - RESERVE_RESERVATION_RETENTION_ENABLED=${RESERVE_RESERVATION_RETENTION_ENABLED:-false}
      - RESERVE_RESERVATION_RETENTION_PURGE_ENABLED=${RESERVE_RESERVATION_RETENTION_PURGE_ENABLED:-false}
      - RESERVE_RESERVATION_CONSENT_ENABLED=${RESERVE_RESERVATION_CONSENT_ENABLED:-false}
      - RESERVE_RESERVATION_CONSENT_RECIPIENT_RETENTION=${RESERVE_RESERVATION_CONSENT_RECIPIENT_RETENTION:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # OAuth 연결 해제 outbox 토큰 암호화 전용 키(권장). 비면 JWT 키에서 목적 분리 파생.
      - OAUTH_UNLINK_ENCRYPTION_KEY=${OAUTH_UNLINK_ENCRYPTION_KEY:-}
      - OAUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED=${OAUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED:-false}
      - OAUTH_PROVIDER_TOKEN_ENCRYPTION_KEY=${OAUTH_PROVIDER_TOKEN_ENCRYPTION_KEY:-}
      - OAUTH_SECURITY_EVENTS_GOOGLE_ENABLED=${OAUTH_SECURITY_EVENTS_GOOGLE_ENABLED:-false}
      - OAUTH_SECURITY_EVENTS_KAKAO_ENABLED=${OAUTH_SECURITY_EVENTS_KAKAO_ENABLED:-false}
      - OAUTH_SECURITY_EVENTS_NAVER_ENABLED=${OAUTH_SECURITY_EVENTS_NAVER_ENABLED:-false}
      - KAKAO_APP_ID=${KAKAO_APP_ID:-}
      - CHAT_IMAGE_ENCRYPTION_KEY=${CHAT_IMAGE_ENCRYPTION_KEY:-}
      - FEED_ENABLED=${FEED_ENABLED:-false}
      - STORE_NEWS_ENABLED=${STORE_NEWS_ENABLED:-false}
      - FEED_INTERACTIONS_ENABLED=${FEED_INTERACTIONS_ENABLED:-false}
      - FEED_IMAGE_ENCRYPTION_KEY=${FEED_IMAGE_ENCRYPTION_KEY:-}
      - CHAT_RETENTION_ENABLED=${CHAT_RETENTION_ENABLED:-false}
      - CHAT_RETENTION_NOTICE_PUBLISHED_AT=${CHAT_RETENTION_NOTICE_PUBLISHED_AT:-}
      - CHAT_RETENTION_ACCESS_AUDIT_YEARS=${CHAT_RETENTION_ACCESS_AUDIT_YEARS:-1}
      - WAITING_RETENTION_ENABLED=${WAITING_RETENTION_ENABLED:-true}
      - WAITING_RETENTION_NOTICE_PUBLISHED_AT=${WAITING_RETENTION_NOTICE_PUBLISHED_AT:-}
      - WAITING_CUSTOMER_RETENTION_NOTICE_PUBLISHED_AT=${WAITING_CUSTOMER_RETENTION_NOTICE_PUBLISHED_AT:-}
      - RESERVE_SERVICE_ADMISSION_ENABLED=${RESERVE_SERVICE_ADMISSION_ENABLED:-false}
      - RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED=${RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED:-false}
      - RESERVE_SERVICE_ADMISSION_CAPACITY=${RESERVE_SERVICE_ADMISSION_CAPACITY:-20}
      - RESERVE_SERVICE_ADMISSION_SESSION_SECONDS=${RESERVE_SERVICE_ADMISSION_SESSION_SECONDS:-900}
      - RESERVE_SERVICE_ADMISSION_MAX_SESSION_SECONDS=${RESERVE_SERVICE_ADMISSION_MAX_SESSION_SECONDS:-7200}
      - RESERVE_SERVICE_ADMISSION_HEARTBEAT_TIMEOUT_SECONDS=${RESERVE_SERVICE_ADMISSION_HEARTBEAT_TIMEOUT_SECONDS:-90}
      - RESERVE_SERVICE_ADMISSION_MAX_WAITING=${RESERVE_SERVICE_ADMISSION_MAX_WAITING:-1000}
      - RESERVE_SERVICE_ADMISSION_EPOCH=${RESERVE_SERVICE_ADMISSION_EPOCH:-}
      - RESERVE_REDIS_ENABLED=${RESERVE_REDIS_ENABLED:-false}
      - RESERVE_REDIS_HOST=${RESERVE_REDIS_HOST:-redis}
      - RESERVE_REDIS_PORT=${RESERVE_REDIS_PORT:-6379}
      - RESERVE_REDIS_PASSWORD=${RESERVE_REDIS_PASSWORD:-}
      - RESERVE_REDIS_USERNAME=${RESERVE_REDIS_USERNAME:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PORTONE_V2_SECRET=${PORTONE_V2_SECRET}
      - PORTONE_STORE_ID=${PORTONE_STORE_ID}
      # 서명 키가 없으면 앱은 기동하지만 모든 PortOne 웹훅을 거부한다.
      - PORTONE_WEBHOOK_SECRET=${PORTONE_WEBHOOK_SECRET}
      # QR 체크인 서명 키(선택). 비면 로그인 시크릿에서 파생한다 — 비어 있는 게 정상이다.
      - QR_TOKEN_SECRET=${QR_TOKEN_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=reserve_app
      - DB_PASSWORD=${DB_APP_PASSWORD:?DB_APP_PASSWORD is required for deployment}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - MAIL_FROM=${MAIL_FROM}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - SENTRY_DSN=${SENTRY_DSN}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      # 없으면 달력에 빨간날 표시만 빠진다. 예약 동작에는 영향 없음.
      - HOLIDAY_API_KEY=${HOLIDAY_API_KEY}
      # 지역 대표 관광 사진 수집용. 비면 기존 정적 사진·핀 폴백만 사용한다.
      - TOURISM_API_SERVICE_KEY=${TOURISM_API_SERVICE_KEY}
    volumes:
      - /var/log/reserve:/var/log/reserve
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
