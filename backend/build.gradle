plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Dependency locking ???�존??버전 고정?�로 보안 강화 (SonarCloud S6405)
dependencyLocking {
    lockAllConfigurations()
}

group = 'kr.it.reserve'
// ⚠️ frontend/package.json 의 version 과 항상 같이 올린다.
//    2.0.2 · 2.0.3 · 2.1.0 세 번을 여기만 안 올려서 프론트 2.1.0 / 백엔드 2.0.1 로 벌어져 있었다.
version = '2.2.0'
description = 'We are reserve'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// JJWT???�프링�??��? 버전??관리해주�? ?�는 ?��? ?�이브러리라 ??곳에 모아 관�?// (0.12.x부?�는 ?��? API가 builder ?�턴?�로 ?�게 바뀌어???�순 버전 ?�그?�이?��? ?�니??//  TokenProvider 코드 ?�체�??�봐??????지금�? 0.11.5 ?��?)
ext {
    jjwtVersion = '0.13.0'
}

dependencies {
    // AWS SDK Platform BOM ??관???�존?�보??먼�? ?�언?�두??�?관례??가?�성??좋음(기능??차이???�음)
    implementation platform('software.amazon.awssdk:bom:2.48.4')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AWS S3 (?��?지 ?�로??+ Pre-signed URL)
    implementation 'software.amazon.awssdk:s3'


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // H2 Database (로컬 ?�스?�용)
    runtimeOnly 'com.h2database:h2'
}

// plain.jar ?�성 비활?�화 (?�행 가?�한 bootJar�??�성)
jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}
