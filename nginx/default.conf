# ── Rate Limiting: IP당 요청 제한 ──────────────────────────────────
# api_zone : API 엔드포인트 20요청/초 (burst 40 = 일시적 사용량 허용)
# static_zone: SPA 정적 파일 80요청/초 (burst 120)
limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=static_zone:10m rate=80r/s;

# 연결 수 제한: IP당 동시 연결 최대 50개
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

upstream blue {
    server PRIVATE_IP:8080;
}
upstream green {
    server PRIVATE_IP:8081;
}
server {
    listen 80;
    listen [::]:80;
    server_name reserve.it.kr www.reserve.it.kr;
    return 301 https://reserve.it.kr$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reserve.it.kr www.reserve.it.kr;
    ssl_certificate /etc/letsencrypt/live/reserve.it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reserve.it.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        # API 요청 제한: 20r/s, burst 40 초과 시 503 대신 429 반환
        limit_req zone=api_zone burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_zone 50;
        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /oauth2/authorization/ {
        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /login/oauth2/ {
        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location / {
        # SPA 정적 파일 요청 제한
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name grafana.reserve.it.kr;
    return 301 https://grafana.reserve.it.kr$request_uri;
}

server {
    listen 443 ssl;
    server_name grafana.reserve.it.kr;
    ssl_certificate /etc/letsencrypt/live/grafana.reserve.it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.reserve.it.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
