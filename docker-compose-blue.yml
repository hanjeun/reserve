version: '3.8'
services:
  blue:
    container_name: blue
    # CI가 IMAGE_TAG=sha-<커밋>을 export해서 커밋 고정 이미지를 띄운다.
    # 수동 실행 등으로 값이 없으면 기존처럼 :latest로 폴백한다.
    image: ${DOCKERHUB_USERNAME}/reserve:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=blue
      - SERVER_ENV=blue
      - JAVA_OPTS=-Xmx512m -Xms256m
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PORTONE_IMP_KEY=${PORTONE_IMP_KEY}
      - PORTONE_IMP_SECRET=${PORTONE_IMP_SECRET}
      - PORTONE_IMP_CODE=${PORTONE_IMP_CODE}
      - PORTONE_V2_SECRET=${PORTONE_V2_SECRET}
      - PORTONE_STORE_ID=${PORTONE_STORE_ID}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - MAIL_WEBHOOK_SECRET=${MAIL_WEBHOOK_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
    volumes:
      - /var/log/reserve:/var/log/reserve
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: true
