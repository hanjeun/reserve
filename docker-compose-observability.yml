# Add to the existing monitoring compose; recreate only promtail with --no-deps.
# Set this to the validated directory of nginxserver's Docker LogPath before applying.
services:
  promtail:
    volumes:
      # The base compose's ~ would resolve to /root under sudo; keep the live source.
      - type: bind
        source: /home/ubuntu/promtail-config.yml
        target: /etc/promtail/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RESERVE_NGINX_LOG_DIR:?Set the verified nginxserver log directory}
        target: /var/log/reserve-nginx
        read_only: true
        bind:
          create_host_path: false
