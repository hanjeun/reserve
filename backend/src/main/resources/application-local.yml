# ============================================
# 로컬 개발 환경 전용 설정
# ============================================

spring:
  config:
    activate:
      on-profile: local

  # 개발 도구 (로컬 전용)
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  # 로컬 MySQL 연결
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD_LOCAL:1234}

  # OAuth2 Redirect URI (localhost)
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://localhost:8080/login/oauth2/code/google
          naver:
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
          kakao:
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao

# 서버 설정
server:
  port: 8080
  serverAddress: localhost
  env: local

serverName: local_server

# 로컬 추가 로깅
logging:
  level:
    org.hibernate.SQL: DEBUG

# S3 로컬 환경 prefix (운영 데이터와 분리)
s3:
  env-prefix: local
