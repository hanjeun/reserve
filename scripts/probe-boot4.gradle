apply plugin: 'java'

def sourceRepo = file(providers.gradleProperty('sourceRepo').get()).canonicalFile
def targetBoot = providers.gradleProperty('targetBoot').get()
if (!(targetBoot ==~ /4\.[01]\.\d+/)) throw new GradleException('Use a supported stable Boot 4 line')
repositories {
    maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
    mavenCentral()
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
sourceSets.main.java.srcDirs = [new File(sourceRepo, 'backend/src/main/java')]
sourceSets.main.resources.srcDirs = []
sourceSets.test.java.srcDirs = []
sourceSets.test.resources.srcDirs = []

def current = new File(sourceRepo, 'backend/build.gradle').getText('UTF-8')
def jjwt = (current =~ /jjwtVersion\s*=\s*'([^']+)'/)
if (!jjwt.find()) throw new GradleException('Current JJWT version is required')
def jjwtVersion = jjwt.group(1)
def aws = (current =~ /implementation platform\('software.amazon.awssdk:bom:([^']+)'\)/)
if (!aws.find()) throw new GradleException('Current AWS SDK BOM is required')
def awsVersion = aws.group(1)
dependencies {
    implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:' + targetBoot)
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:' + targetBoot)
    implementation platform('software.amazon.awssdk:bom:' + awsVersion)
    if (providers.gradleProperty('legacyJackson').getOrElse('false') == 'true') {
        def patchedJackson = (current =~ /ext\['jackson-bom.version'\]\s*=\s*'([^']+)'/)
        if (!patchedJackson.find()) throw new GradleException('Keep the current patched Jackson 2 BOM')
        implementation 'org.springframework.boot:spring-boot-jackson2'
        implementation enforcedPlatform('com.fasterxml.jackson:jackson-bom:' + patchedJackson.group(1))
    }
}
// 원본 소스·잠금 파일은 유지하고 대상 BOM으로 주 코드의 컴파일만 확인한다.
current.eachLine { line ->
    def dependency = line =~ /^\s*(implementation|compileOnly|annotationProcessor|runtimeOnly)\s+['"]([^'"]+)['"]\s*$/
    if (dependency.matches()) {
        def coordinate = dependency.group(2).replace('$' + '{jjwtVersion}', jjwtVersion)
        if (coordinate == 'org.springframework.boot:spring-boot-starter-web') coordinate = 'org.springframework.boot:spring-boot-starter-webmvc'
        dependencies.add(dependency.group(1), coordinate)
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.memoryMaximumSize = '384m'
    options.compilerArgs.addAll(['-Xmaxerrs', '40'])
}
tasks.register('probeVersions') {
    doLast {
        def selected = ['spring-boot', 'spring-core', 'spring-security-core', 'hibernate-core', 'jackson-databind']
        configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.findAll { selected.contains(it.name) }.each {
            println 'Boot 4 probe dependency: ' + it.moduleVersion.id
        }
    }
}
