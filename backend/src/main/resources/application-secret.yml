spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope: name, email, profile_image
            client-name: Naver
            authorization-grant-type: authorization_code

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: profile_nickname, profile_image, account_email
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post

jwt:
  secret-key: ${JWT_SECRET_KEY}

# Base64로 인코딩한 독립 32-byte AES 키. 미설정이면 사진 첨부만 비활성화한다.
# JWT/AWS 키와 혼용하지 않는다. 기존 사진·백업을 복호화할 수 있도록 키를 별도 보관한다.
chat:
  images:
    encryption-key: ${CHAT_IMAGE_ENCRYPTION_KEY:}

# OAuth 연결 해제 작업의 토큰 암호화 키이며, 없으면 JWT 키에서 목적을 분리해 파생한다.
# 독립 키나 파생에 쓰는 JWT 키를 바꾸기 전에는 미완료 작업이 없는지 확인해야 한다.
oauth:
  unlink:
    encryption-key: ${OAUTH_UNLINK_ENCRYPTION_KEY:}
  provider-tokens:
    encryption-enabled: ${OAUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED:false}
    encryption-key: ${OAUTH_PROVIDER_TOKEN_ENCRYPTION_KEY:}
  security-events:
    google:
      enabled: ${OAUTH_SECURITY_EVENTS_GOOGLE_ENABLED:false}
      client-ids: ${GOOGLE_CLIENT_ID:}
    kakao:
      enabled: ${OAUTH_SECURITY_EVENTS_KAKAO_ENABLED:false}
      rest-api-key: ${KAKAO_REST_API_KEY:}
      app-id: ${KAKAO_APP_ID:}
    naver:
      enabled: ${OAUTH_SECURITY_EVENTS_NAVER_ENABLED:false}

# QR 전용 키가 없으면 로그인 키에서 목적을 분리해 파생한다(HMAC-SHA256).
# 키를 바꾸면 기존에 발급한 QR은 무효가 된다.
qr:
  token-secret: ${QR_TOKEN_SECRET:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

# 공공데이터포털의 특일 정보 키이며 미설정이면 외부 조회 없이 공휴일 표시만 생략한다.
# 인코딩된 키와 디코딩된 키를 모두 처리한다.
holiday:
  api-key: ${HOLIDAY_API_KEY:}

# 한국관광공사 관광정보 서비스 GW 인증키.
# TourismRegionPhotoService가 시도별 대표 사진 후보를 확인할 때만 서버에서 읽는다.
# 실제 키는 로컬 환경변수 또는 배포 환경의 secret에만 둔다. 이 파일에는 절대 넣지 않는다.
tourism:
  api:
    service-key: ${TOURISM_API_SERVICE_KEY:}

mail:
  username: resend
  password: ${RESEND_API_KEY}

portone:
  v2-secret: ${PORTONE_V2_SECRET}
  store-id: ${PORTONE_STORE_ID}
  # PortOne 웹훅 시크릿은 whsec_ 뒤에 Base64 값을 사용한다. 미설정이면 모든 웹훅을 거부한다.
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}

# AWS S3 (env-prefix는 환경별 yml에서 설정 — local: "local", prod: "")
s3:
  bucket: ${S3_BUCKET_NAME:reserve-it-kr-bucket}
  cloudfront: ${CLOUDFRONT_DOMAIN:cdn.reserve.it.kr}
  region: ${AWS_REGION:ap-northeast-2}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
