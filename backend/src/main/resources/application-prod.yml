# 배포 환경 공통 설정 (Blue/Green 공통)

spring:
  config:
    activate:
      on-profile: prod

  # Docker MySQL 연결
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:reserve_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  # OAuth2 Redirect URI (배포 도메인)
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          naver:
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
          kakao:
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"

# Redis remains disabled unless explicitly enabled. Only the internal service alias or RFC1918 address is accepted.
reserve:
  service-admission:
    # Opt-in only; capacity/lifetime bindings are shared with application-common.yml.
    enabled: ${RESERVE_SERVICE_ADMISSION_ENABLED:false}
    automatic:
      enabled: ${RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED:false}
  redis:
    host: ${RESERVE_REDIS_HOST:}

# Limits/relays have a bounded fallback. Enabled admission gates fail closed when Redis is unavailable.
management:
  health:
    redis:
      enabled: false

# 서버 공통 설정 (포트는 blue/green에서 개별 설정)
server:
  serverAddress: reserve.it.kr
  env: prod
  forward-headers-strategy: native

# 프론트엔드 URL
app:
  frontend-url: ${APP_FRONTEND_URL:https://reserve.it.kr}

# CORS 허용 출처 (쉼표 구분 — SecurityConfig의 @Value List<String> 바인딩)
# SiteUrls가 설정된 앱·기존 OAuth 복구 출처를 추가한다. localhost·ngrok은 local.yml에만 둔다.
cors:
  allowed-origins: "https://reserve.it.kr"

# 가게 검색의 FULLTEXT 후보 기능은 코드 기본값 true이며, 아래 설정을 추가할 필요는 없다.
# StoreFulltextSearch가 MySQL/ngram_token_size=2/정확한 다섯 컬럼의 ngram 인덱스를 한 번 확인한다.
# H2·인덱스 미설치·탐지 실패는 LIKE를 사용한다. 명시 false는 탐지 없이 LIKE만 사용한다.
# 후보 MATCH에도 원문 LIKE·공개 필터·정렬을 적용하고, 같은 repeatable-read 스냅샷의 count가
# 일치할 때만 후보 페이지를 반환한다. 누락·MATCH 오류는 LIKE로 폴백하며 반복 오류를 막는다.
# LIKE count 비용도 유지하므로 속도 향상을 보장하지 않는다.
# DDL은 docs/technical/manual-ddl.md를 따라 승인된 계정으로 적용한다.
# 미설치 판정은 캐시되므로 실행 중 인덱스를 설치했다면 새 앱 기동 때 다시 탐지한다.
#
# search:
#   store:
#     fulltext-enabled: true

# 운영 환경 로깅 — DEBUG 로그 비활성화
logging:
  level:
    root: WARN
    kr.it.reserve: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
