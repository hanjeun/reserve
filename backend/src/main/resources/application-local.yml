# ============================================
# 로컬 개발 환경 전용 설정
# ============================================

spring:
  config:
    activate:
      on-profile: local

  # 개발 도구 (로컬 전용)
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  # 로컬 MySQL 연결
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/reserve?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    # localhost 전용 개발 계정이다. 공개 레포라 기본값이 그대로 보이지만, 이 DB는 외부에
    # 노출되지 않고 운영 DB는 prod 프로파일에서 ${DB_PASSWORD}로 따로 주입된다.
    # 다른 값을 쓰려면 DB_PASSWORD_LOCAL 환경변수로 덮으면 된다. 이 값을 다른 곳에 재사용하지 말 것.
    password: ${DB_PASSWORD_LOCAL:1234}

  # OAuth2 Redirect URI (localhost)
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          naver:
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
          kakao:
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"

# 서버 설정
server:
  port: 8080
  serverAddress: localhost
  env: local

serverName: local_server

# 로컬 추가 로깅
logging:
  level:
    org.hibernate.SQL: DEBUG

# S3 로컬 환경 prefix (운영 데이터와 분리)
s3:
  env-prefix: local

# CORS 허용 출처 (쉼표 구분 — SecurityConfig의 @Value List<String> 바인딩)
#
# ⚠️ ngrok 도메인은 실기기(모바일) 테스트용이라 로컬 프로파일에만 둔다.
#    운영(prod)에 새는 순간 제3자 도메인이 allowCredentials=true로 우리 쿠키를 읽을 수 있다.
#    ngrok 주소가 바뀌면 여기만 고치면 된다.
cors:
  allowed-origins: "http://localhost:5173,https://reserve.it.kr,https://slouching-blubber-worst.ngrok-free.dev"
