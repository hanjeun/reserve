name: Gradle Dependency Graph

on:
  push:
    branches: [dev]
    paths:
      - 'backend/*.gradle'
      - 'backend/gradle.properties'
      - 'backend/gradle.lockfile'
      - 'backend/gradle/**'
      - 'backend/gradlew'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-gradle-dependencies:
    if: github.repository == 'hanjeun/reserve' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: backend
