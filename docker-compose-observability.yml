# 기존 모니터링 구성에 추가하며 Promtail만 --no-deps로 재생성한다.
# 적용 전에 nginxserver의 실제 Docker 로그 디렉터리를 확인한다.
services:
  promtail:
    volumes:
      # sudo 실행 시 홈 경로가 달라지지 않도록 실제 설정 경로를 고정한다.
      - type: bind
        source: /home/ubuntu/promtail-config.yml
        target: /etc/promtail/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RESERVE_NGINX_LOG_DIR:?Set the verified nginxserver log directory}
        target: /var/log/reserve-nginx
        read_only: true
        bind:
          create_host_path: false
