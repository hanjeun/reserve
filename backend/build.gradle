plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Dependency locking — 의존성 버전 고정으로 보안 강화 (SonarCloud S6405)
dependencyLocking {
    lockAllConfigurations()
}

group = 'kr.it.reserve'
// ⚠️ frontend/package.json 의 version 과 항상 같이 올린다.
//    2.0.2 · 2.0.3 · 2.1.0 세 번을 여기만 안 올려서 프론트 2.1.0 / 백엔드 2.0.1 로 벌어져 있었다.
version = '2.4.1'
description = 'We are reserve'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// JJWT는 스프링부트가 버전을 관리해주지 않는 외부 라이브러리라 한 곳에 모아 관리한다.
// 0.12.x 부터 내부 API 가 builder 패턴으로 바뀌어 단순 버전 업그레이드가 아니었고,
// TokenProvider 코드까지 함께 손봐서 0.13.0 으로 올렸다(2026-07, 599db27).
ext {
    jjwtVersion = '0.13.0'
}

dependencies {
    // AWS SDK Platform BOM — 관련 의존성보다 먼저 선언해두는 게 관례상 가독성이 좋음(기능적 차이는 없음)
    implementation platform('software.amazon.awssdk:bom:2.48.4')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    // 버전을 적지 않는다 — Spring Boot BOM 이 관리하는 의존성이라 Boot 가 검증한 버전이 붙는다.
    // 직접 박아두면 Boot 와 어긋날 수 있고, dependabot 이 EE 11(3.0.0) PR 을 계속 올린다.
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AWS S3 (이미지 업로드 + Pre-signed URL)
    implementation 'software.amazon.awssdk:s3'


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // H2 Database (로컬 테스트용)
    runtimeOnly 'com.h2database:h2'
}

// plain.jar 생성 비활성화 (실행 가능한 bootJar만 생성)
jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}
