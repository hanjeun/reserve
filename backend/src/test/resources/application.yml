# 시험 설정. 작업자는 해당 시험에서만 명시적으로 실행하며 다른 시험의 타이머로 실행하지 않는다.
reserve:
  scheduling:
    enabled: false
reservation:
  code-backfill:
    enabled: false

advertisement:
  payments:
    reconciliation-enabled: false

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: reserve-test

  # 테스트용 H2 데이터베이스
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # OAuth2 테스트 설정 (비활성화)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            scope: name, email
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            scope: profile_nickname, account_email
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 기본값이 없는 환경 구분 설정
server:
  port: 8080
  serverAddress: localhost
  env: test
serverName: test_server

# JWT 테스트 설정 (64자 이상의 키 필요)
jwt:
  issuer: test-issuer
  secret-key: test-secret-key-for-jwt-authentication-that-is-at-least-64-characters-long-for-hmac-sha256
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 7

# MailConfig가 요구하는 전체 메일 설정
mail:
  host: smtp.test.com
  port: 465
  username: test@test.com
  password: test-password
  properties:
    mail:
      smtp:
        auth: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# PortOne 테스트 설정
portone:
  v2-secret: test-v2-secret
  store-id: test-store-id
  # 정상 서명도 검증하도록 whsec_ 뒤에는 유효한 Base64 시험값을 사용한다.
  webhook-secret: whsec_dGVzdC13ZWJob29rLXNlY3JldC0xMjM0NTY3OA==

# Kakao REST API (주소 검색용)
kakao:
  rest-api-key: test-kakao-rest-api-key

# 파일 저장 서비스가 요구하는 중첩 S3 시험 설정
s3:
  bucket: test-bucket
  cloudfront: test.cloudfront.net
  region: ap-northeast-2
  access-key: test-access-key
  secret-key: test-secret-key

# 시험은 외부 네트워크에 의존하지 않도록 유출 비밀번호 확인을 끈다. 다른 환경은 코드 기본값을 유지한다.
security:
  pwned-password:
    enabled: false

# 일부 테이블 생성만 실패한 상태로 시험이 진행되지 않도록 DDL 오류에서 중단한다.
logging:
  level:
    org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl: DEBUG
