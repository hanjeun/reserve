plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Dependency locking — 의존성 버전 고정으로 보안 강화 (SonarCloud S6405)
dependencyLocking {
    lockAllConfigurations()
}

group = 'kr.it.reserve'
version = '2.0.0'
description = 'We are reserve'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// JJWT는 스프링부트가 버전을 관리해주지 않는 외부 라이브러리라 한 곳에 모아 관리
// (0.12.x부터는 내부 API가 builder 패턴으로 크게 바뀌어서 단순 버전 업그레이드가 아니라
//  TokenProvider 코드 자체를 손봐야 함 — 지금은 0.11.5 유지)
ext {
    jjwtVersion = '0.11.5'
}

dependencies {
    // AWS SDK Platform BOM — 관련 의존성보다 먼저 선언해두는 게 관례상 가독성이 좋음(기능적 차이는 없음)
    implementation platform('software.amazon.awssdk:bom:2.25.28')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AWS S3 (이미지 업로드 + Pre-signed URL)
    implementation 'software.amazon.awssdk:s3'


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // H2 Database (로컬 테스트용)
    runtimeOnly 'com.h2database:h2'
}

// plain.jar 생성 비활성화 (실행 가능한 bootJar만 생성)
jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}
