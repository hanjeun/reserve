spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope: name, email, profile_image
            client-name: Naver
            authorization-grant-type: authorization_code

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: profile_nickname, profile_image, account_email
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post

jwt:
  secret-key: ${JWT_SECRET_KEY}

# QR 체크인 토큰 전용 서명 키. **비워두는 것이 정상 상태다.**
# 비어 있으면 QrCheckinTokenProvider 가 jwt.secret-key 에서 파생한다(HMAC-SHA256).
# 파생만으로도 로그인 토큰과 키가 달라져 목적(서명 단계 분리)은 달성된다.
# 완전 독립이 필요해지면 32자 이상 값을 넣으면 되고, compose·CI 배선은 이미 되어 있다.
# ⚠️ 값을 바꾸면 그 순간 발급돼 있던 QR 이 전부 무효가 된다(수명 최대 24시간).
qr:
  token-secret: ${QR_TOKEN_SECRET:}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

mail:
  username: resend
  password: ${RESEND_API_KEY}

portone:
  v2-secret: ${PORTONE_V2_SECRET}
  store-id: ${PORTONE_STORE_ID}
  # PortOne 콘솔에서 발급하는 웹훅 시크릿(whsec_ 접두사 + base64).
  # 비워두면 웹훅이 **전부 거부**된다(fail-closed) — 검증 없이 통과시키면
  # 아무나 "이 결제 취소됐다"를 쏴서 예약을 취소시킬 수 있기 때문이다.
  # 값이 없어도 앱은 정상 기동한다(기존 결제·환불 경로는 웹훅과 무관).
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}

# AWS S3 (env-prefix는 환경별 yml에서 설정 — local: "local", prod: "")
s3:
  bucket: ${S3_BUCKET_NAME:reserve-it-kr-bucket}
  cloudfront: ${CLOUDFRONT_DOMAIN:cdn.reserve.it.kr}
  region: ${AWS_REGION:ap-northeast-2}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
