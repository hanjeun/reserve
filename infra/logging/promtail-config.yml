# Deployed to the server at ~/promtail-config.yml, which is what the compose
# file mounts. Editing this file alone changes nothing on the server:
# Apply the validated nginx-directory overlay and recreate only promtail.
# Preserve the positions volume; see docs/technical/monitoring.md.

server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Spring Boot application log (logback).
  #
  # pipeline_stages is NOT optional here. Without it promtail stamps each line
  # with the moment it was READ, not the moment it was WRITTEN. A promtail
  # restart re-reads the whole file and dumps a day of logs into one second,
  # which silently destroys every time-based panel and alert. That was the state
  # of this stack until 2026-08-19 and nobody noticed, because the dashboards
  # still rendered -- they were just showing a lie.
  #
  # The app container runs in UTC, so `location: UTC` must match logback's
  # %d{yyyy-MM-dd HH:mm:ss}. Getting this wrong shifts everything by 9 hours.
  #
  # The `level` label is what the dashboards filter on. It is an index label, so
  # {job="reserve", level="ERROR"} costs far less than scanning lines for "ERROR"
  # -- and it cannot false-positive on a message that merely contains the word.
  - job_name: reserve
    static_configs:
      - targets:
          - localhost
        labels:
          job: reserve
          __path__: /var/log/reserve/app.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) +(?P<level>[A-Z]+)'
      - labels:
          level:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05'
          location: UTC

  # Backup timestamps differ from the application parser. Preserve both deployed formats.
  - job_name: backup
    static_configs:
      - targets:
          - localhost
        labels:
          job: backup
          __path__: /var/log/reserve/backup.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) +(?:(?P<level>[A-Z]+) +)?\[backup\]'
      - labels:
          level:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05'
          location: UTC

  # Only the nginx container's directory is mounted; no Docker socket or other logs.
  # Drop every line that is not the complete privacy-safe reserve_timing schema.
  # Docker's timestamp is retained, including on restart; stderr is never shipped.
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/reserve-nginx/*-json.log
    pipeline_stages:
      - docker: {}
      - drop:
          older_than: 1h
          drop_counter_reason: nginx_older_than_1h
      - match:
          selector: '{job="nginx", stream!="stdout"}'
          action: drop
          drop_counter_reason: nginx_non_stdout
      - match:
          selector: '{job="nginx"} !~ "^\\{\"time\":\"[0-9]+[.][0-9]+\",\"route\":\"(spa|asset|store_detail|store_list|chat|api_other|health)\",\"method\":\"(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|TRACE|CONNECT)\",\"status\":[1-5][0-9]{2},\"request_time\":\"[0-9]+[.][0-9]+\",\"upstream_connect_time\":\"[-0-9.,: ]*\",\"upstream_header_time\":\"[-0-9.,: ]*\",\"upstream_response_time\":\"[-0-9.,: ]*\",\"cache\":\"(HIT|MISS|BYPASS|EXPIRED|STALE|UPDATING|REVALIDATED|-|)\"\\}[[:space:]]*$"'
          action: drop
          drop_counter_reason: nginx_non_timing

  # Host/container metrics from scripts/collect-metrics.sh (cron, every minute).
  #
  # No Prometheus + node_exporter: this is a 2GB box and blue/green deploys run
  # two ~600MB app containers at once, which already pushes it into swap.
  # Prometheus would add 170-320MB and could OOM a deploy. This path costs no
  # resident memory at all. Trade-off: fixed 1-minute resolution.
  #
  # No timestamp stage on purpose -- these lines carry no time field, and the
  # read time IS the sample time (within a second).
  - job_name: metrics
    static_configs:
      - targets:
          - localhost
        labels:
          job: metrics
          __path__: /var/log/metrics/*.log
