# Deployed to the server at ~/docker-compose-monitoring.yml.
# Apply with:  docker compose -f ~/docker-compose-monitoring.yml up -d
# See docs/technical/monitoring.md.

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    # Promtail은 app-network의 loki:3100으로 접근한다. 호스트에 publish할 이유가 없다.
    expose:
      - "3100"
    volumes:
      # Without this, all log history lives in the container layer and a single
      # `docker compose up --force-recreate` wipes it. That is how this stack
      # ran until 2026-08-19.
      - loki-data:/loki
    networks:
      - app-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - /var/log/reserve:/var/log/reserve:ro
      - /var/log/metrics:/var/log/metrics:ro
      # ⚠️ 서버의 ~/promtail-config.yml 을 마운트한다. 레포만 고치면 반영되지 않는다.
      - ~/promtail-config.yml:/etc/promtail/config.yml
      # positions.yaml records how far each file has been read. On the container
      # layer it vanishes on restart, so promtail re-ships the whole file and
      # every line lands at the restart moment -- which is what broke the time
      # axis before the timestamp stage was added.
      - promtail-positions:/tmp
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    # nginx도 같은 app-network에서 grafana:3000으로 프록시한다. 외부 공개는 nginx만 담당한다.
    expose:
      - "3000"
    environment:
      # Not hardcoded: this seeds the password when grafana-data is first
      # created, so a literal value in a public repo IS the initial password.
      # The running instance already has its own, making this a no-op today --
      # it matters the next time the volume is recreated.
      #
      # `:?`(미설정 시 기동 실패)는 쓰지 않는다. 환경변수를 깜빡하고 재시작하면
      # Grafana 가 통째로 안 뜨는데, 그게 지금 위험보다 실수 비용이 크다.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - app-network
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data:
  promtail-positions:

networks:
  app-network:
    external: true
