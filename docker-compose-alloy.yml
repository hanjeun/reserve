# Candidate overlay only. Stop Promtail and preserve its positions before starting Alloy.
# Use with the existing monitoring and nginx observability overlays; never start both collectors.
# RESERVE_NGINX_LOG_DIR must be the current nginxserver Docker log directory.
# Production cutover requires separate approval; see docs/technical/monitoring.md.
services:
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      - /var/log/reserve:/var/log/reserve:ro
      - /var/log/metrics:/var/log/metrics:ro
      - ${RESERVE_NGINX_LOG_DIR:?set the current nginx Docker log directory}:/var/log/reserve-nginx:ro
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - promtail-positions:/tmp:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  alloy-data:
