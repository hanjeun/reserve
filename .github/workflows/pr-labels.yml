name: PR Labels
run-name: >-
  ${{ format('라벨 정리 · PR #{0}', github.event.pull_request.number) }}

# 제목의 유형 라벨 하나를 붙인다. 본문만 편집한 경우에는 러너를 시작하지 않는다.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [ "main", "dev" ]

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    if: github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.action != 'edited' || github.event.changes.title != null)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const TYPE_LABELS = {
              feat: { name: 'feat', color: '0e8a16', description: 'New product functionality' },
              fix: { name: 'fix', color: 'd73a4a', description: 'Bug fix' },
              refactor: { name: 'refactor', color: '1d76db', description: 'Code change without behavior change' },
              docs: { name: 'documentation', color: '0075ca', description: 'Improvements or additions to documentation' },
              chore: { name: 'chore', color: '6f42c1', description: 'Maintenance, tooling, and repository operations' },
              release: { name: 'release', color: '5319e7', description: 'Release to production' },
              style: { name: 'style', color: 'c5def5', description: 'Visual or formatting change' },
              test: { name: 'test', color: 'bfd4f2', description: 'Tests only' },
              perf: { name: 'perf', color: 'fbca04', description: 'Performance improvement' },
            };
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if (pr.user.login === 'dependabot[bot]') return;

            const ensureLabel = async ({ name, color, description }) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            const typeMatch = /^(\w+)(\([^)]*\))?!?:/.exec(pr.title);
            const typeLabel = typeMatch ? TYPE_LABELS[typeMatch[1]] : undefined;
            if (!typeLabel) return;

            await ensureLabel(typeLabel);
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });

            // 자동 유형·영역 라벨과 옛 중복 유형만 정리하고 수동 상태 라벨은 보존한다.
            const managedNames = new Set([
              ...Object.values(TYPE_LABELS).map((label) => label.name),
              'frontend', 'backend', 'infra', 'bug', 'enhancement',
            ]);
            for (const label of labels) {
              if (managedNames.has(label.name) && label.name !== typeLabel.name) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label.name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            if (!labels.some((label) => label.name === typeLabel.name)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [typeLabel.name] });
            }
