name: Sonar CI

# 정적 분석은 요청할 때만 실행하며 커버리지 목표로 테스트나 배포를 반복하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Compile Java analysis inputs
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew classes testClasses --console=plain
      - name: Install frontend analysis tools
        working-directory: frontend
        run: npm ci
      - name: Analyze backend and frontend
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'SONAR_TOKEN is required'; exit 1; }
          ./gradlew -I ../scripts/sonar-ci.init.gradle sonar --console=plain
