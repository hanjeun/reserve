name: CICD

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  # deploy-backend 잡이 GitHub Deployment 객체를 만들기 위해 필요하다.
  # 이게 없으면 저장소 Environments 탭·커밋 화면에 "언제 무엇이 production에 나갔는지" 기록이 남지 않는다.
  deployments: write

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. 백엔드 빌드 + Docker 이미지 푸시
  # ─────────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # `build`는 test를 포함한다. 예전엔 `-x test`로 테스트를 건너뛰었지만,
      # src/test/resources/application.yml에 H2·JWT·OAuth2·S3 더미 설정이 모두 갖춰져 있어
      # 외부 의존 없이 통과한다(2026-07-28 기준 12개 통과, 약 30초).
      # 특히 SecurityConfigAuthorizationTest는 permitAll/authenticated 규칙이 의도와 어긋나는
      # 회귀를 잡는 유일한 안전망이라 CI에서 반드시 돌아야 한다.
      - name: Build with Gradle
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      # 테스트가 깨졌을 때 Actions 로그만으로는 원인 파악이 어려워 리포트를 첨부한다.
      # if: failure() — 실패한 경우에만 업로드해서 아티팩트 용량을 낭비하지 않는다.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 7

      # ── 여기부터는 main push에서만 실행한다 ──────────────────────────────
      # 예전엔 조건이 없어서 main으로 PR을 여는 것만으로 이미지가 빌드·푸시됐다.
      # deploy-backend가 :latest를 pull하므로, PR을 열어둔 상태에서 배포가 돌면
      # 머지되지도 않은 PR 코드가 운영에 나갈 수 있었다. (실제로 dev→main PR 3건이 이 경로를 탔다)
      # 빌드·테스트는 위에서 이미 끝났으므로 PR의 검증 가치는 그대로 유지된다.
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 커밋 SHA 태그를 함께 붙인다. :latest만 있으면 "지금 운영에 뜬 게 어느 커밋인지",
      # "롤백하면 어디로 돌아가는지"를 특정할 수 없다. sha-<커밋>은 불변이라 롤백 대상이 명확해진다.
      # :latest도 계속 유지 — 수동 조작이나 긴급 상황의 폴백 경로로 남겨둔다.
      # 시크릿과 github 컨텍스트는 run 스크립트에 직접 확장하지 않고 env로 넘긴다.
      # ${{ }}는 셸이 해석하기 전에 문자열로 치환되므로, 값에 따옴표나 개행이 섞이면
      # 스크립트 구조 자체가 바뀔 수 있다(SonarCloud: Avoid expanding secrets in a run block).
      - name: Build Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t "$DOCKERHUB_USERNAME/reserve:latest" \
            -t "$DOCKERHUB_USERNAME/reserve:sha-$COMMIT_SHA" \
            ./backend

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker push "$DOCKERHUB_USERNAME/reserve:sha-$COMMIT_SHA"
          docker push "$DOCKERHUB_USERNAME/reserve:latest"

  # ─────────────────────────────────────────────────────────
  # 2. 프론트엔드 빌드 + EC2 Nginx로 정적 파일 배포
  # build-backend 완료 후 실행 → deploy-backend와 Nginx reload 충돌 방지
  # ─────────────────────────────────────────────────────────
  build-frontend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # npx 대신 package.json의 lint:ci 스크립트를 호출한다 — npx는 로컬에 없으면 레지스트리에서
      # 즉석으로 받아 실행할 수 있어(그 패키지의 lifecycle 스크립트까지) 공급망 관점에서 위험하다.
      # npm ci로 설치된 로컬 eslint만 쓰도록 고정. 실행되는 명령 자체는 이전과 동일하다.
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint:ci

      # .env.production 파일을 GitHub Secrets로 생성
      - name: Create .env.production
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PORTONE_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_CHANNEL_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: |
          cat > .env.production << EOF
          VITE_API_BASE_URL=$VITE_API_BASE_URL
          VITE_PORTONE_CHANNEL_KEY=$VITE_PORTONE_CHANNEL_KEY
          VITE_SKELETON_DELAY=0
          VITE_SENTRY_DSN=$VITE_SENTRY_DSN
          VITE_KAKAO_JS_KEY=$VITE_KAKAO_JS_KEY
          EOF

      - name: Build React app
        working-directory: frontend
        run: npm run build

      # ── 여기부터는 main push에서만 실행한다 ──────────────────────────────
      # ★ job 레벨에 if를 걸면 안 된다. build-frontend는 main 브랜치 보호의 "필수 상태 체크"라,
      #   job이 스킵되면 체크가 보고되지 않아 모든 PR이 영영 머지 불가가 된다.
      #   (deployments.md에 적어둔 deploy-backend 함정의 반대 방향 사례)
      #   그래서 job은 그대로 돌리고 배포 스텝 3개에만 조건을 건다 —
      #   PR에서는 npm ci·lint·build까지만 돌아 검증은 유지되고 서버는 건드리지 않는다.
      # 빌드 결과물(dist/)을 EC2로 전송
      - name: Deploy frontend to EC2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/reserve-frontend"
          strip_components: 2

      # nginx 설정 파일 EC2로 전송
      - name: Deploy nginx config
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "nginx/default.conf"
          target: "/home/ubuntu/"
          strip_components: 1

      # Nginx가 서빙하는 폴더로 이동 + 권한 설정
      # PRIVATE_IP 플레이스홀더를 서버 사설 IP로 치환 후 Nginx에 적용
      - name: Reload Nginx static files
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /home/ubuntu/reserve-frontend/* /usr/share/nginx/html/
            sudo chown -R nginx:nginx /usr/share/nginx/html/ 2>/dev/null || true
            PRIVATE_IP=$(hostname -I | awk '{print $1}')
            sed -i "s/PRIVATE_IP/${PRIVATE_IP}/g" /home/ubuntu/default.conf
            sudo docker cp /home/ubuntu/default.conf nginxserver:/etc/nginx/conf.d/default.conf
            sudo docker exec nginxserver nginx -s reload

  # ─────────────────────────────────────────────────────────
  # 3. Blue/Green 백엔드 배포 (백엔드 빌드 완료 후 실행)
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 배포 이력 기록 — first-party 액션만 쓴다(외부 액션 의존성 추가 없음).
      # 이 스텝이 실패해도 배포 자체는 막지 않도록 continue-on-error를 둔다.
      - name: Create GitHub deployment
        id: deployment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              production_environment: true,
              description: 'Blue/Green backend deploy',
            });
            core.setOutput('id', dep.data.id);

      # ★ 판별은 반드시 서버 안에서 한다.
      #
      # 예전엔 GitHub 러너에서 `http://<SERVER_IP>:8080|8081/actuator/health` 를 외부망으로 쳤다.
      # 그런데 8080·8081은 Lightsail 방화벽에서 막혀 있어 항상 연결 실패였다.
      # 실제 Actions 로그(run 30237158924 / 29889775850)에서 두 번 다 이렇게 찍혔다:
      #     Blue status: 000000 / Green status: 000000 / Current upstream: none
      # 결과적으로 **매 배포가 CURRENT_UPSTREAM=none → 항상 blue로 배포 + `docker stop none`** 이었다.
      # 즉 무중단 배포가 작동한 적이 없고 green은 영영 쓰이지 않았다.
      # 아래 Health check 스텝이 이미 SSH 내부 curl 패턴이므로 같은 방식으로 맞춘다.
      #
      # (`000000` 이 찍혔던 이유: curl이 -w로 "000"을 출력하고 exit≠0이라 `|| echo "000"`까지 실행돼
      #  두 번 붙었다. 아래에서는 명령 치환 밖에서 폴백을 주어 값이 겹치지 않게 한다.)
      - name: Detect active upstream (inside server)
        id: detect
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          capture_stdout: true
          script: |
            STATUS_BLUE=$(curl -o /dev/null -w "%{http_code}" -s --connect-timeout 5 http://localhost:8080/actuator/health) || STATUS_BLUE="000"
            STATUS_GREEN=$(curl -o /dev/null -w "%{http_code}" -s --connect-timeout 5 http://localhost:8081/actuator/health) || STATUS_GREEN="000"
            echo "blue=$STATUS_BLUE green=$STATUS_GREEN"
            if [ "$STATUS_BLUE" = "200" ]; then
              echo "DETECTED_UPSTREAM=blue"
            elif [ "$STATUS_GREEN" = "200" ]; then
              echo "DETECTED_UPSTREAM=green"
            else
              echo "DETECTED_UPSTREAM=none"
            fi

      - name: Set target IP
        env:
          # capture_stdout 결과에는 drone-ssh의 래퍼 출력이 섞이므로 마지막 표식 줄만 골라 쓴다.
          DETECT_STDOUT: ${{ steps.detect.outputs.stdout }}
        run: |
          CURRENT_UPSTREAM=$(printf '%s\n' "$DETECT_STDOUT" \
            | grep -o 'DETECTED_UPSTREAM=[a-z]*' | tail -n 1 | cut -d= -f2)

          # 판별 자체가 실패했으면(출력 파싱 불가) 배포를 멈춘다.
          # 여기서 조용히 none으로 넘어가면 예전과 똑같이 매번 blue를 덮어쓰게 된다.
          if [ -z "$CURRENT_UPSTREAM" ]; then
            echo "::error::Failed to detect active upstream from SSH output"
            exit 1
          fi

          echo "Current upstream: $CURRENT_UPSTREAM"
          echo CURRENT_UPSTREAM=$CURRENT_UPSTREAM >> $GITHUB_ENV

          if [ "$CURRENT_UPSTREAM" = "blue" ]; then
            echo "CURRENT_PORT=8080"    >> $GITHUB_ENV
            echo "STOPPED_PORT=8081"   >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=green" >> $GITHUB_ENV
          else
            echo "CURRENT_PORT=8081"   >> $GITHUB_ENV
            echo "STOPPED_PORT=8080"   >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=blue" >> $GITHUB_ENV
          fi

  # SSH 접속 정보 (AWS Lightsail — 변수명은 EC2 시절 레거시, 실제론 Lightsail)
      - name: Deploy docker-compose files to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose-blue.yml,docker-compose-green.yml"
          target: "/home/ubuntu/"

      - name: Docker compose up (target)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 커밋 SHA로 고정된 이미지를 배포한다. :latest는 언제든 다른 커밋으로 바뀔 수 있어
            # "지금 뜬 게 어느 커밋인지"를 사후에 특정할 수 없었다.
            # compose 파일은 ${IMAGE_TAG:-latest}로 읽으므로 미설정 시 기존 동작(:latest)으로 폴백한다.
            export IMAGE_TAG=sha-${{ github.sha }}
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/reserve:$IMAGE_TAG
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            export GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            export GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            export NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            export NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            export KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            export KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            export RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            export PORTONE_IMP_KEY=${{ secrets.PORTONE_IMP_KEY }}
            export PORTONE_IMP_SECRET=${{ secrets.PORTONE_IMP_SECRET }}
            export PORTONE_IMP_CODE=${{ secrets.PORTONE_IMP_CODE }}
            export PORTONE_V2_SECRET=${{ secrets.PORTONE_V2_SECRET }}
            export PORTONE_STORE_ID=${{ secrets.PORTONE_STORE_ID }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export MAIL_FROM=${{ secrets.MAIL_FROM }}
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            export CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}
            export MAIL_WEBHOOK_SECRET=${{ secrets.MAIL_WEBHOOK_SECRET }}
            export SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            export KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            sudo -E docker compose -f /home/ubuntu/docker-compose-${{ env.TARGET_UPSTREAM }}.yml up -d

      - name: Health check (new server)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in $(seq 1 10); do
              STATUS=$(curl -o /dev/null -w "%{http_code}" -s --connect-timeout 5 http://localhost:${{ env.STOPPED_PORT }}/actuator/health || echo "000")
              echo "Attempt $i: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed!"
                exit 0
              fi
              sleep 15
            done
            echo "Health check failed after 10 attempts"
            exit 1

      - name: Rollback on health check failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Health check failed. Rolling back..."
            sudo docker stop ${{ env.TARGET_UPSTREAM }} || true
            sudo docker rm ${{ env.TARGET_UPSTREAM }} || true
            echo "Rollback complete. Keeping ${{ env.CURRENT_UPSTREAM }}"

      - name: Switch Nginx upstream
        if: success()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker exec -i nginxserver bash -c \
              'echo "set \$service_url ${{ env.TARGET_UPSTREAM }};" > /etc/nginx/conf.d/service-env.inc && nginx -s reload'

      - name: Stop old server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 최초 기동처럼 이전 컨테이너가 없는 경우 CURRENT_UPSTREAM=none 이다.
            # `docker stop none`은 매번 에러를 뱉으므로(예전 로그를 오래 오염시켰다) 건너뛴다.
            if [ "${{ env.CURRENT_UPSTREAM }}" = "none" ]; then
              echo "No previous container to stop (first deploy or both were down)"
            else
              sudo docker stop ${{ env.CURRENT_UPSTREAM }} || true
              sudo docker rm   ${{ env.CURRENT_UPSTREAM }} || true
            fi

      - name: Cleanup Docker resources
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker image prune -af --filter "until=24h" || true
            sudo docker system prune -f || true

      # 배포 결과 기록. deployment 생성이 실패했으면(id 없음) 조용히 건너뛴다.
      - name: Mark deployment success
        if: success() && steps.deployment.outputs.id
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'success',
              environment_url: 'https://reserve.it.kr',
              description: 'Deployed to production',
            });

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.id
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'failure',
              description: 'Deploy failed (health check/rollback)',
            });
