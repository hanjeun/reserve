name: CICD

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # PR에서 검증하고 서버 변경은 main push에서만 수행한다.
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

# PR의 오래된 실행은 취소하고, 운영 배포는 중간에 끊기지 않도록 순서대로 실행한다.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 기본 권한은 읽기로 제한하고 배포 기록 쓰기는 해당 잡에서만 허용한다.
permissions:
  contents: read

env:
  # appleboy가 협상하는 ECDSA 호스트 키 지문이다. OpenSSH의 ED25519 지문과 구분한다.
  RESERVE_SSH_FINGERPRINT: SHA256:xHW59RSgd8gAWYCnNhQwX/Q3qB9+45Qp3k0UUSzmRSk

jobs:
  test-backend:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Restore verified backend test evidence
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_FORCE_TESTS: ${{ github.event_name == 'workflow_dispatch' || vars.CI_FORCE_TESTS == 'true' }}
          CI_TEST_CONFIG_REVISION: ${{ vars.CI_TEST_CONFIG_REVISION }}
        run: node scripts/ci-evidence.mjs restore backend
      - name: Test backend (unit, Spring/H2, isolated MySQL and Redis)
        id: backend_tests
        if: steps.evidence.outputs.reused != 'true'
        run: bash scripts/test-backend-isolated.sh
      - name: Record successful backend test evidence
        id: record
        env:
          EVIDENCE_ORIGIN: ${{ steps.evidence.outputs.origin_run }}
          EVIDENCE_EXECUTED_AT: ${{ steps.evidence.outputs.executed_at }}
          CI_TEST_CONFIG_REVISION: ${{ vars.CI_TEST_CONFIG_REVISION }}
        run: node scripts/ci-evidence.mjs record backend
      - name: Upload successful backend test evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-backend-${{ steps.record.outputs.key }}
          overwrite: true
          path: .ci-evidence/backend/evidence.json
          retention-days: 7
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          retention-days: 7

  test-frontend:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore verified frontend test evidence
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_FORCE_TESTS: ${{ github.event_name == 'workflow_dispatch' || vars.CI_FORCE_TESTS == 'true' }}
          CI_TEST_CONFIG_REVISION: ${{ vars.CI_TEST_CONFIG_REVISION }}
        run: node scripts/ci-evidence.mjs restore frontend
      - name: Validate Grafana dashboards
        run: node scripts/validate-grafana-dashboards.mjs
      - name: Validate documentation links
        run: node scripts/check-doc-links.mjs
      - name: Load published baseline for preservation checks
        run: git fetch --no-tags --depth=1 origin c20ce59c4aec1cfc727fe1cba12960b0e7c78e74
      - name: Verify immutable design-system snapshot
        shell: pwsh
        run: ./scripts/design-system-snapshot.ps1 -Stage Verify -InstallGitGuard
      - name: Validate operations scripts
        run: |
          node --test scripts/tests/observability-config.test.mjs scripts/tests/deployment-memory.test.mjs scripts/tests/release-schema-readonly.test.mjs scripts/tests/backup-engine.test.mjs
          bash -n scripts/backup-mysql.sh
          bash -n scripts/restore-mysql.sh
          bash -n scripts/verify-post-deploy-readonly.sh
          bash -n scripts/verify-mysql-row-lock.sh
          bash -n scripts/test-backend-isolated.sh
          bash -n scripts/check-deployment-memory.sh
          bash -n scripts/test-frontend-release-swap.sh
          bash -n scripts/preserve-frontend-assets.sh
          bash -n scripts/test-frontend-assets.sh
          bash -n scripts/domain-release.sh
          bash scripts/test-frontend-assets.sh
          bash scripts/test-frontend-release-swap.sh
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint:ci
      - name: Test repository quality policies
        working-directory: frontend
        run: npm run test:policy
      - name: Test frontend (unit and React components)
        if: steps.evidence.outputs.reused != 'true'
        working-directory: frontend
        run: npm run test:run
      - name: Install Playwright Chromium
        if: steps.evidence.outputs.reused != 'true'
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Test PC browser (Chromium)
        id: browser_pc
        if: steps.evidence.outputs.reused != 'true'
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium --output=test-results/pc
      - name: Test mobile browser (Pixel 7 Chromium)
        id: browser_mobile
        if: "!cancelled() && steps.evidence.outputs.reused != 'true' && (success() || (failure() && steps.browser_pc.outcome == 'failure'))"
        working-directory: frontend
        run: npm run test:e2e -- --project=mobile-chromium --output=test-results/mobile
      - name: Record successful frontend test evidence
        id: record
        env:
          EVIDENCE_ORIGIN: ${{ steps.evidence.outputs.origin_run }}
          EVIDENCE_EXECUTED_AT: ${{ steps.evidence.outputs.executed_at }}
          CI_TEST_CONFIG_REVISION: ${{ vars.CI_TEST_CONFIG_REVISION }}
        run: node scripts/ci-evidence.mjs record frontend
      - name: Upload successful frontend test evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-frontend-${{ steps.record.outputs.key }}
          overwrite: true
          path: .ci-evidence/frontend/evidence.json
          retention-days: 7
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-backend:
    permissions:
      contents: read
      actions: read
    needs: [test-backend, build-frontend]
    # 의존 검사 실패가 필수 빌드의 성공이나 건너뜀으로 가려지지 않도록 직접 확인한다.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require backend test success
        env:
          TEST_RESULT: ${{ needs.test-backend.result }}
          FRONTEND_RESULT: ${{ needs.build-frontend.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$FRONTEND_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Download frontend HTML from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "frontend-release-$GITHUB_SHA" --dir frontend/dist

      # 성공한 테스트 입력을 포장하며 테스트를 반복하거나 우회하지 않는다.
      - name: Package backend bootJar
        id: backend_package
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --console=plain

      # 검증된 main push에서만 이미지를 푸시해 미병합 PR이 운영 후보를 바꾸지 못하게 한다.
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 커밋 SHA 태그로 배포 후보를 식별한다. latest는 호환 경로로 함께 유지한다.
      # 시크릿은 env로 전달해 셸 스크립트에 문자열로 직접 치환하지 않는다.
      - name: Build Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            --label reserve.schema-compat=v280-mfa-completion-settlement-v1 \
            --label reserve.feature-compat=waiting-signup-hidden-feed-oauth-login-session-admission-mfa-completion-test-settlement-v11 \
            -t "$DOCKERHUB_USERNAME/reserve:latest" \
            -t "$DOCKERHUB_USERNAME/reserve:sha-$COMMIT_SHA" \
            ./backend

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker push "$DOCKERHUB_USERNAME/reserve:sha-$COMMIT_SHA"
          docker push "$DOCKERHUB_USERNAME/reserve:latest"

  # 빌드 산출물을 실행 SHA에 묶으며 서버 쓰기는 준비 작업과 배포 작업으로 제한한다.
  build-frontend:
    needs: test-frontend
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend test success
        env:
          TEST_RESULT: ${{ needs.test-frontend.result }}
        run: |
          test "$TEST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env.production
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PORTONE_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_CHANNEL_KEY }}
          VITE_PORTONE_NAVERPAY_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_NAVERPAY_CHANNEL_KEY }}
          VITE_PORTONE_TOSS_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_TOSS_CHANNEL_KEY }}
          VITE_PORTONE_TOSS_EASY_PAY_PROVIDERS: ${{ vars.VITE_PORTONE_TOSS_EASY_PAY_PROVIDERS }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          RESERVE_DOMAIN_SPLIT: ${{ vars.RESERVE_DOMAIN_SPLIT || 'false' }}
        run: |
          case "$RESERVE_DOMAIN_SPLIT" in
            true) VITE_API_BASE_URL=''; VITE_APP_ORIGIN=https://app.reserve.it.kr ;;
            false) VITE_APP_ORIGIN=https://reserve.it.kr ;;
            *) echo 'RESERVE_DOMAIN_SPLIT must be true or false'; exit 1 ;;
          esac
          cat > .env.production << EOF
          VITE_API_BASE_URL=$VITE_API_BASE_URL
          VITE_API_VERSION=v1
          VITE_PORTONE_CHANNEL_KEY=$VITE_PORTONE_CHANNEL_KEY
          VITE_PORTONE_NAVERPAY_CHANNEL_KEY=$VITE_PORTONE_NAVERPAY_CHANNEL_KEY
          VITE_PORTONE_TOSS_CHANNEL_KEY=$VITE_PORTONE_TOSS_CHANNEL_KEY
          VITE_PORTONE_TOSS_EASY_PAY_PROVIDERS=$VITE_PORTONE_TOSS_EASY_PAY_PROVIDERS
          VITE_SKELETON_DELAY=0
          VITE_SENTRY_DSN=$VITE_SENTRY_DSN
          VITE_KAKAO_JS_KEY=$VITE_KAKAO_JS_KEY
          VITE_APP_ORIGIN=$VITE_APP_ORIGIN
          VITE_MARKETING_ORIGIN=https://reserve.it.kr
          VITE_LEGACY_APP_ORIGIN=https://reserve.it.kr
          EOF

      - name: Check secret publication boundaries
        run: node scripts/check-secret-boundaries.mjs --include frontend/.env.production

      - name: Build React app
        working-directory: frontend
        run: npm run build

      - name: Stamp frontend release
        working-directory: frontend
        env:
          FRONTEND_RELEASE: ${{ github.sha }}
        run: |
          [[ "$FRONTEND_RELEASE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf '%s\n' "$FRONTEND_RELEASE" > dist/release-id.txt

      - name: Upload built frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-release-${{ github.sha }}
          overwrite: true
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Build marketing site for domain split
        if: vars.RESERVE_DOMAIN_SPLIT == 'true'
        env:
          RELEASE_ID: ${{ github.sha }}
        run: node marketing/build.mjs
      - name: Upload marketing release
        if: vars.RESERVE_DOMAIN_SPLIT == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: marketing-release-${{ github.sha }}
          path: marketing/dist/
          if-no-files-found: error
          retention-days: 7

  #  서버로 전송만 한다. production Environment/Deployment는 실제 활성화 잡 하나에만 둔다.
  stage-release:
    permissions:
      contents: read
      actions: read
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "frontend-release-$GITHUB_SHA" --dir frontend/dist

      # main-push-only staging 잡이므로 PR에서는 서버에 접근하지 않는다.
      - name: Prepare split host configuration
        if: vars.RESERVE_DOMAIN_SPLIT == 'true'
        run: node scripts/prepare-domain-split.mjs --output nginx/default.conf
      - name: Download marketing release
        if: vars.RESERVE_DOMAIN_SPLIT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "marketing-release-$GITHUB_SHA" --dir marketing/dist
      - name: Stage marketing files
        if: vars.RESERVE_DOMAIN_SPLIT == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          source: "marketing/dist/*"
          target: "/home/ubuntu/reserve-marketing-${{ github.sha }}"
          strip_components: 2
      - name: Stage domain release helper
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          source: "scripts/domain-release.sh"
          target: "/home/ubuntu"
          strip_components: 1
      - name: Deploy frontend to EC2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/reserve-frontend-${{ github.sha }}"
          strip_components: 2

      - name: Deploy nginx config
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          source: "nginx/default.conf,scripts/preserve-frontend-assets.sh"
          target: "/home/ubuntu/"
          strip_components: 1

      # SHA별 정적 파일과 nginx 템플릿만 staging한다. live 전환은 새 백엔드가
      # 정상 기동한 뒤 deploy-backend 잡에서 한 번의 nginx reload로 수행한다.
      - name: Stage frontend release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          FRONTEND_RELEASE: ${{ github.sha }}
          RESERVE_DOMAIN_SPLIT: ${{ vars.RESERVE_DOMAIN_SPLIT || 'false' }}
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          envs: FRONTEND_RELEASE,RESERVE_DOMAIN_SPLIT
          script: |
            bash -Eeuo pipefail <<'RESERVE_STAGE'
            case "$FRONTEND_RELEASE" in
              ''|*[!0-9a-f]*) echo "Invalid frontend release id"; exit 1 ;;
            esac
            if [ ${#FRONTEND_RELEASE} -ne 40 ]; then
              echo "Frontend release id must be a full commit SHA"
              exit 1
            fi

            RELEASE_ROOT=/usr/share/nginx/html/releases
            RELEASE_DIR="$RELEASE_ROOT/$FRONTEND_RELEASE"
            INCOMING_DIR="$RELEASE_ROOT/.incoming-$FRONTEND_RELEASE"
            UPLOAD_DIR="/home/ubuntu/reserve-frontend-$FRONTEND_RELEASE"
            NGINX_TEMPLATE="/home/ubuntu/default-$FRONTEND_RELEASE.conf"

            test -f "$UPLOAD_DIR/index.html"
            test "$(tr -d '\r\n' < "$UPLOAD_DIR/release-id.txt")" = "$FRONTEND_RELEASE"
            test ! -L "$RELEASE_DIR"
            sudo mkdir -p "$RELEASE_ROOT"
            if [ -d "$RELEASE_DIR" ]; then
              # 재시도에서도 도메인 설정을 포함해 같은 산출물인지 확인한다.
              diff -qr --exclude=assets --exclude=reserve-assets.sha256 "$UPLOAD_DIR" "$RELEASE_DIR"
              OWNED_RECORDS=$(cd "$UPLOAD_DIR" && find assets -mindepth 1 -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum --binary)
              test -n "$OWNED_RECORDS"
              printf '%s\n' "$OWNED_RECORDS" | sudo cmp - "$RELEASE_DIR/reserve-assets.sha256"
              sudo bash -c 'cd "$1" && sha256sum --strict --check reserve-assets.sha256 >/dev/null' _ "$RELEASE_DIR"
            else
              sudo rm -rf -- "$INCOMING_DIR"
              sudo mkdir -p "$INCOMING_DIR"
              sudo cp -a "$UPLOAD_DIR/." "$INCOMING_DIR/"
              test -f "$INCOMING_DIR/index.html"
              sudo bash /home/ubuntu/preserve-frontend-assets.sh "$INCOMING_DIR" "$RELEASE_ROOT" /usr/share/nginx/html/current
              sudo chown -R nginx:nginx "$INCOMING_DIR" 2>/dev/null || true
              sudo mv "$INCOMING_DIR" "$RELEASE_DIR"
            fi
            # 빌드에 포함된 식별자를 검증하며 기존 릴리스의 식별자는 바꾸지 않는다.
            test "$(tr -d '\r\n' < "$RELEASE_DIR/release-id.txt")" = "$FRONTEND_RELEASE"
            if [ "$RESERVE_DOMAIN_SPLIT" = true ]; then
              sudo bash /home/ubuntu/domain-release.sh stage "$FRONTEND_RELEASE"
            fi

            # 다른 SHA의 설정과 섞이지 않도록 후보 파일명을 배포 SHA에 고정한다.
            test -f /home/ubuntu/default.conf
            install -m 0644 /home/ubuntu/default.conf "$NGINX_TEMPLATE"
            rm -f /home/ubuntu/default.conf

            case "$UPLOAD_DIR" in
              /home/ubuntu/reserve-frontend-*) sudo rm -rf -- "$UPLOAD_DIR" ;;
              *) echo "Unexpected upload directory"; exit 1 ;;
            esac

            echo "Frontend staged at $RELEASE_DIR; live configuration is unchanged"
            RESERVE_STAGE

  deploy-backend:
    # production 환경의 자동 배포 기록만 사용하고 체크아웃에 필요한 읽기 권한을 유지한다.
    permissions:
      contents: read
      deployments: write
    needs: [build-backend, build-frontend, test-backend, test-frontend, stage-release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reserve.it.kr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SSH 안에서 nginx의 실제 연결 대상과 내부 health를 대조한다.
      # 양쪽 앱이 모두 정상일 수 있으므로 health 응답 순서로 대상을 추측하지 않는다.
      - name: Detect active upstream (inside server)
        id: detect
        env:
          RESERVE_SERVER_IP: ${{ secrets.RESERVE_SERVER_IP }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          RESERVE_SSH_FINGERPRINT: ${{ env.RESERVE_SSH_FINGERPRINT }}
        run: bash scripts/detect-active-upstream.sh

      - name: Set target IP
        env:
          DETECTED_UPSTREAM: ${{ steps.detect.outputs.current_upstream }}
        run: |
          CURRENT_UPSTREAM="$DETECTED_UPSTREAM"

          # 실제 연결 대상을 알 수 없으면 기존 앱을 덮어쓰지 않도록 중단한다.
          if [ -z "$CURRENT_UPSTREAM" ]; then
            echo "::error::Failed to detect active upstream from SSH output"
            exit 1
          fi

          echo "Current upstream: $CURRENT_UPSTREAM"
          echo CURRENT_UPSTREAM=$CURRENT_UPSTREAM >> $GITHUB_ENV

          case "$CURRENT_UPSTREAM" in
          blue)
            echo "CURRENT_PORT=8080"    >> $GITHUB_ENV
            echo "STOPPED_PORT=8081"   >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=green" >> $GITHUB_ENV
            ;;
          green)
            echo "CURRENT_PORT=8081"   >> $GITHUB_ENV
            echo "STOPPED_PORT=8080"   >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=blue" >> $GITHUB_ENV
            ;;
          *)
            echo "::error::Unexpected live upstream: $CURRENT_UPSTREAM"
            exit 1
            ;;
          esac

      - name: Deploy docker-compose files to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.RESERVE_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          source: "docker-compose-blue.yml,docker-compose-green.yml,scripts/check-deployment-memory.sh"
          target: "/home/ubuntu/"

      - name: Docker compose up (target)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          OAUTH_UNLINK_ENCRYPTION_KEY: ${{ secrets.OAUTH_UNLINK_ENCRYPTION_KEY }}
          OAUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED: ${{ vars.OAUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED || 'false' }}
          OAUTH_PROVIDER_TOKEN_ENCRYPTION_KEY: ${{ secrets.OAUTH_PROVIDER_TOKEN_ENCRYPTION_KEY }}
          OAUTH_SECURITY_EVENTS_GOOGLE_ENABLED: ${{ vars.OAUTH_SECURITY_EVENTS_GOOGLE_ENABLED || 'false' }}
          OAUTH_SECURITY_EVENTS_KAKAO_ENABLED: ${{ vars.OAUTH_SECURITY_EVENTS_KAKAO_ENABLED || 'false' }}
          OAUTH_SECURITY_EVENTS_NAVER_ENABLED: ${{ vars.OAUTH_SECURITY_EVENTS_NAVER_ENABLED || 'false' }}
          KAKAO_APP_ID: ${{ vars.KAKAO_APP_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PORTONE_V2_SECRET: ${{ secrets.PORTONE_V2_SECRET }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_WEBHOOK_SECRET: ${{ secrets.PORTONE_WEBHOOK_SECRET }}
          QR_TOKEN_SECRET: ${{ secrets.QR_TOKEN_SECRET }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
          TOURISM_API_SERVICE_KEY: ${{ secrets.TOURISM_API_SERVICE_KEY }}
          CHAT_IMAGE_ENCRYPTION_KEY: ${{ secrets.CHAT_IMAGE_ENCRYPTION_KEY }}
          FEED_ENABLED: ${{ vars.FEED_ENABLED || 'false' }}
          FEED_INTERACTIONS_ENABLED: ${{ vars.FEED_INTERACTIONS_ENABLED || 'false' }}
          STORE_NEWS_ENABLED: ${{ vars.STORE_NEWS_ENABLED || 'false' }}
          RESERVE_DOMAIN_SPLIT: ${{ vars.RESERVE_DOMAIN_SPLIT || 'false' }}
          FEED_IMAGE_ENCRYPTION_KEY: ${{ secrets.FEED_IMAGE_ENCRYPTION_KEY }}
          CHAT_RETENTION_ENABLED: ${{ vars.CHAT_RETENTION_ENABLED || 'false' }}
          CHAT_RETENTION_NOTICE_PUBLISHED_AT: ${{ vars.CHAT_RETENTION_NOTICE_PUBLISHED_AT }}
          CHAT_RETENTION_ACCESS_AUDIT_YEARS: ${{ vars.CHAT_RETENTION_ACCESS_AUDIT_YEARS || '1' }}
          WAITING_RETENTION_ENABLED: ${{ vars.WAITING_RETENTION_ENABLED || 'true' }}
          WAITING_RETENTION_NOTICE_PUBLISHED_AT: ${{ vars.WAITING_RETENTION_NOTICE_PUBLISHED_AT }}
          WAITING_CUSTOMER_RETENTION_NOTICE_PUBLISHED_AT: ${{ vars.WAITING_CUSTOMER_RETENTION_NOTICE_PUBLISHED_AT }}
          RESERVE_REDIS_ENABLED: ${{ vars.RESERVE_REDIS_ENABLED || 'false' }}
          RESERVE_REDIS_HOST: ${{ vars.RESERVE_REDIS_HOST || 'redis' }}
          RESERVE_REDIS_PORT: ${{ vars.RESERVE_REDIS_PORT || '6379' }}
          RESERVE_REDIS_PASSWORD: ${{ secrets.RESERVE_REDIS_PASSWORD }}
          RESERVE_REDIS_USERNAME: ${{ vars.RESERVE_REDIS_USERNAME }}
          RESERVE_MFA_ENABLED: ${{ vars.RESERVE_MFA_ENABLED || 'false' }}
          RESERVE_MFA_RP_ID: ${{ vars.RESERVE_MFA_RP_ID || 'app.reserve.it.kr' }}
          RESERVE_MFA_ORIGINS: ${{ vars.RESERVE_MFA_ORIGINS || 'https://app.reserve.it.kr' }}
          RESERVE_MFA_ENCRYPTION_KEY: ${{ secrets.RESERVE_MFA_ENCRYPTION_KEY }}
          RESERVE_RESERVATION_AUTO_COMPLETION_ENABLED: ${{ vars.RESERVE_RESERVATION_AUTO_COMPLETION_ENABLED || 'false' }}
          RESERVE_SETTLEMENT_TEST_ENABLED: ${{ vars.RESERVE_SETTLEMENT_TEST_ENABLED || 'false' }}
          RESERVE_SERVICE_ADMISSION_ENABLED: ${{ vars.RESERVE_SERVICE_ADMISSION_ENABLED || 'false' }}
          RESERVE_SERVICE_ADMISSION_CAPACITY: ${{ vars.RESERVE_SERVICE_ADMISSION_CAPACITY || '20' }}
          RESERVE_SERVICE_ADMISSION_SESSION_SECONDS: ${{ vars.RESERVE_SERVICE_ADMISSION_SESSION_SECONDS || '900' }}
          RESERVE_SERVICE_ADMISSION_MAX_SESSION_SECONDS: ${{ vars.RESERVE_SERVICE_ADMISSION_MAX_SESSION_SECONDS || '7200' }}
          RESERVE_SERVICE_ADMISSION_HEARTBEAT_TIMEOUT_SECONDS: ${{ vars.RESERVE_SERVICE_ADMISSION_HEARTBEAT_TIMEOUT_SECONDS || '90' }}
          RESERVE_SERVICE_ADMISSION_MAX_WAITING: ${{ vars.RESERVE_SERVICE_ADMISSION_MAX_WAITING || '1000' }}
          RESERVE_SERVICE_ADMISSION_EPOCH: ${{ vars.RESERVE_SERVICE_ADMISSION_EPOCH }}
          RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED: ${{ vars.RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED || 'false' }}
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          envs: RESERVE_MFA_ENABLED,RESERVE_MFA_RP_ID,RESERVE_MFA_ORIGINS,RESERVE_MFA_ENCRYPTION_KEY,RESERVE_RESERVATION_AUTO_COMPLETION_ENABLED,RESERVE_SETTLEMENT_TEST_ENABLED,IMAGE_TAG,DOCKERHUB_USERNAME,JWT_SECRET_KEY,OAUTH_UNLINK_ENCRYPTION_KEY,OAUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED,OAUTH_PROVIDER_TOKEN_ENCRYPTION_KEY,OAUTH_SECURITY_EVENTS_GOOGLE_ENABLED,OAUTH_SECURITY_EVENTS_KAKAO_ENABLED,OAUTH_SECURITY_EVENTS_NAVER_ENABLED,KAKAO_APP_ID,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,RESEND_API_KEY,PORTONE_V2_SECRET,PORTONE_STORE_ID,PORTONE_WEBHOOK_SECRET,QR_TOKEN_SECRET,DB_APP_PASSWORD,MAIL_FROM,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,S3_BUCKET_NAME,CLOUDFRONT_DOMAIN,SENTRY_DSN,KAKAO_REST_API_KEY,HOLIDAY_API_KEY,TOURISM_API_SERVICE_KEY,CHAT_IMAGE_ENCRYPTION_KEY,FEED_ENABLED,FEED_INTERACTIONS_ENABLED,STORE_NEWS_ENABLED,RESERVE_DOMAIN_SPLIT,FEED_IMAGE_ENCRYPTION_KEY,CHAT_RETENTION_ENABLED,CHAT_RETENTION_NOTICE_PUBLISHED_AT,CHAT_RETENTION_ACCESS_AUDIT_YEARS,WAITING_RETENTION_ENABLED,WAITING_RETENTION_NOTICE_PUBLISHED_AT,WAITING_CUSTOMER_RETENTION_NOTICE_PUBLISHED_AT,RESERVE_REDIS_ENABLED,RESERVE_REDIS_HOST,RESERVE_REDIS_PORT,RESERVE_REDIS_PASSWORD,RESERVE_REDIS_USERNAME,RESERVE_SERVICE_ADMISSION_ENABLED,RESERVE_SERVICE_ADMISSION_CAPACITY,RESERVE_SERVICE_ADMISSION_SESSION_SECONDS,RESERVE_SERVICE_ADMISSION_MAX_SESSION_SECONDS,RESERVE_SERVICE_ADMISSION_HEARTBEAT_TIMEOUT_SECONDS,RESERVE_SERVICE_ADMISSION_MAX_WAITING,RESERVE_SERVICE_ADMISSION_EPOCH,RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED
          script: |
            set -e
            # latest가 가리키는 이미지가 바뀌어도 같은 입력을 유지하도록 SHA 태그를 명시한다.
            : "${DB_APP_PASSWORD:?DB_APP_PASSWORD is required for deployment}"
            : "${RESERVE_MFA_ENCRYPTION_KEY:?A dedicated MFA key is required for v11 recovery}"
            for MFA_FEATURE_FLAG in "$RESERVE_MFA_ENABLED" "$RESERVE_RESERVATION_AUTO_COMPLETION_ENABLED" "$RESERVE_SETTLEMENT_TEST_ENABLED"; do
              case "$MFA_FEATURE_FLAG" in true|false) ;; *) echo 'Invalid MFA or settlement feature flag'; exit 1 ;; esac
            done
            # 빈 Actions 비밀값으로 서버의 보호된 기존 키를 가리지 않는다.
            if [ -z "${OAUTH_UNLINK_ENCRYPTION_KEY:-}" ]; then
              unset OAUTH_UNLINK_ENCRYPTION_KEY
            fi
            case "$OAUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED" in
              true) : "${OAUTH_PROVIDER_TOKEN_ENCRYPTION_KEY:?A dedicated provider-token encryption key is required}" ;;
              false) ;;
              *) echo '::error::Invalid provider-token encryption flag'; exit 1 ;;
            esac
            for OAUTH_EVENTS_FLAG in "$OAUTH_SECURITY_EVENTS_GOOGLE_ENABLED" "$OAUTH_SECURITY_EVENTS_KAKAO_ENABLED" "$OAUTH_SECURITY_EVENTS_NAVER_ENABLED"; do
              case "$OAUTH_EVENTS_FLAG" in true|false) ;; *) echo '::error::Invalid provider-event flag'; exit 1 ;; esac
            done
            if [ "$OAUTH_SECURITY_EVENTS_KAKAO_ENABLED" = true ]; then
              : "${KAKAO_APP_ID:?Kakao app ID is required for signed provider events}"
            fi
            case "$RESERVE_REDIS_ENABLED" in
              true) : "${RESERVE_REDIS_PASSWORD:?A dedicated Redis password is required when Redis is enabled}" ;;
              false) ;;
              *) echo 'RESERVE_REDIS_ENABLED must be true or false'; exit 1 ;;
            esac
            case "$RESERVE_SERVICE_ADMISSION_ENABLED" in
              true)
                [ "$RESERVE_REDIS_ENABLED" = true ] || { echo 'Service admission requires Redis'; exit 1; }
                case "$RESERVE_SERVICE_ADMISSION_EPOCH" in
                  ''|*[!A-Za-z0-9-]*) echo 'Invalid service admission epoch'; exit 1 ;;
                esac
                [ "${#RESERVE_SERVICE_ADMISSION_EPOCH}" -ge 16 ] && [ "${#RESERVE_SERVICE_ADMISSION_EPOCH}" -le 64 ] || { echo 'Invalid service admission epoch'; exit 1; }
                ;;
              false) ;;
              *) echo 'RESERVE_SERVICE_ADMISSION_ENABLED must be true or false'; exit 1 ;;
            esac
            case "$RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED" in
              true) [ "$RESERVE_SERVICE_ADMISSION_ENABLED" = true ] || { echo 'Automatic protection requires service admission'; exit 1; } ;;
              false) ;;
              *) echo 'RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED must be true or false'; exit 1 ;;
            esac
            case "$FEED_ENABLED" in
              true) : "${FEED_IMAGE_ENCRYPTION_KEY:?A dedicated feed image key is required when feed is enabled}" ;;
              false) ;;
              *) echo "FEED_ENABLED must be true or false"; exit 1 ;;
            esac
            case "$FEED_INTERACTIONS_ENABLED" in
              true) [ "$FEED_ENABLED" = 'true' ] || { echo "Feed interactions require the feed feature"; exit 1; } ;;
              false) ;;
              *) echo "FEED_INTERACTIONS_ENABLED must be true or false"; exit 1 ;;
            esac
            case "$STORE_NEWS_ENABLED" in
              true) : "${FEED_IMAGE_ENCRYPTION_KEY:?A dedicated feed image key is required when store news is enabled}" ;;
              false) ;;
              *) echo 'STORE_NEWS_ENABLED must be true or false'; exit 1 ;;
            esac
            case "$RESERVE_DOMAIN_SPLIT" in
              true) APP_FRONTEND_URL=https://app.reserve.it.kr; APP_PUBLIC_URL=$APP_FRONTEND_URL; APP_LEGACY_FRONTEND_URL=https://reserve.it.kr ;;
              false) APP_FRONTEND_URL=https://reserve.it.kr; APP_PUBLIC_URL=$APP_FRONTEND_URL; APP_LEGACY_FRONTEND_URL='' ;;
              *) echo 'RESERVE_DOMAIN_SPLIT must be true or false'; exit 1 ;;
            esac
            export APP_FRONTEND_URL APP_PUBLIC_URL APP_LEGACY_FRONTEND_URL
            export APP_MARKETING_URL=https://reserve.it.kr
            sudo docker pull "$DOCKERHUB_USERNAME/reserve:$IMAGE_TAG"
            sudo bash /home/ubuntu/scripts/check-deployment-memory.sh "${{ env.CURRENT_UPSTREAM }}" "${{ env.TARGET_UPSTREAM }}"
            sudo -E docker compose -f /home/ubuntu/docker-compose-${{ env.TARGET_UPSTREAM }}.yml up -d

      - name: Health check (new server)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          script: |
            for i in $(seq 1 10); do
              STATUS=$(curl -o /dev/null -w "%{http_code}" -s --connect-timeout 5 --max-time 10 http://localhost:${{ env.STOPPED_PORT }}/actuator/health) || STATUS="000"
              echo "Attempt $i: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed!"
                exit 0
              fi
              sleep 15
            done
            echo "Health check failed after 10 attempts"
            exit 1

      - name: Public API readiness (before cutover)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          TARGET_PORT: ${{ env.STOPPED_PORT }}
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          envs: TARGET_PORT
          script: |
            bash -Eeuo pipefail <<'RESERVE_READY'
            case "$TARGET_PORT" in 8080|8081) ;; *) exit 1 ;; esac
            BODY=$(mktemp /tmp/reserve-public-ready-XXXXXX)
            trap 'rm -f -- "$BODY"' EXIT
            READY=0
            for attempt in 1 2 3 4 5; do
              ELAPSED=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                -o "$BODY" -w '%{time_total}' "http://127.0.0.1:$TARGET_PORT/api/stores?page=0&size=48&sort=rating") || ELAPSED=99
              if jq -e '.success == true and (.data.content | type == "array")' "$BODY" >/dev/null 2>&1 \
                 && awk -v seconds="$ELAPSED" 'BEGIN { exit !(seconds < 2.5) }'; then
                READY=$((READY + 1))
              else READY=0; fi
              echo "Public store readiness attempt=$attempt elapsed=$ELAPSED consecutive=$READY"
              if [ "$READY" -ge 2 ]; then exit 0; fi
              sleep 1
            done
            echo "Public store API is not ready; live routing remains unchanged"
            exit 1
            RESERVE_READY

      # 새 프론트의 절대 경로와 새 백엔드 upstream을 함께 설치하고 nginx를 한 번만 reload한다.
      # 중간 명령이 실패하면 ERR trap이 default.conf, service-env.inc, current symlink를 함께 복구한다.
      - name: Cut over frontend and backend
        if: success()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          FRONTEND_RELEASE: ${{ github.sha }}
          TARGET_UPSTREAM: ${{ env.TARGET_UPSTREAM }}
          CURRENT_UPSTREAM: ${{ env.CURRENT_UPSTREAM }}
          DEPLOY_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          envs: FRONTEND_RELEASE,TARGET_UPSTREAM,CURRENT_UPSTREAM,DEPLOY_ATTEMPT
          script: |
            bash -Eeuo pipefail <<'RESERVE_CUTOVER'

            case "$FRONTEND_RELEASE" in
              ''|*[!0-9a-f]*) echo "Invalid frontend release id"; exit 1 ;;
            esac
            if [ ${#FRONTEND_RELEASE} -ne 40 ]; then
              echo "Frontend release id must be a full commit SHA"
              exit 1
            fi
            case "$TARGET_UPSTREAM" in
              blue|green) ;;
              *) echo "Invalid target upstream"; exit 1 ;;
            esac
            case "$CURRENT_UPSTREAM" in
              blue|green) ;;
              *) echo "Invalid recovery upstream"; exit 1 ;;
            esac
            test "$CURRENT_UPSTREAM" != "$TARGET_UPSTREAM"
            [[ "$DEPLOY_ATTEMPT" =~ ^[0-9]+-[0-9]+$ ]] || {
              echo "Invalid deployment attempt id"
              exit 1
            }

            RELEASE_ROOT=/usr/share/nginx/html/releases
            RELEASE_DIR="$RELEASE_ROOT/$FRONTEND_RELEASE"
            NGINX_TEMPLATE="/home/ubuntu/default-$FRONTEND_RELEASE.conf"
            NGINX_CANDIDATE="/home/ubuntu/default-$FRONTEND_RELEASE-$DEPLOY_ATTEMPT.candidate.conf"
            ROLLBACK_DIR="/home/ubuntu/release-rollback-$FRONTEND_RELEASE-$DEPLOY_ATTEMPT"
            ROLLBACK_TMP="$ROLLBACK_DIR.tmp"

            test -f "$RELEASE_DIR/index.html"
            test -f "$NGINX_TEMPLATE"

            # 후보와 복구 이미지가 모두 같은 계약을 지원해야 경로를 전환한다.
            LIVE_ROUTING=$(sudo docker exec nginxserver cat /etc/nginx/conf.d/service-env.inc | tr -d '\r\n')
            if [ "$LIVE_ROUTING" != "set \$service_url $CURRENT_UPSTREAM;" ]; then
              echo "Live routing changed after upstream detection; refusing cutover"
              exit 1
            fi
            for COMPATIBLE_UPSTREAM in "$CURRENT_UPSTREAM" "$TARGET_UPSTREAM"; do
              COMPATIBLE_IMAGE=$(sudo docker inspect --format '{{.Image}}' "$COMPATIBLE_UPSTREAM")
              SCHEMA_COMPAT=$(sudo docker image inspect --format '{{index .Config.Labels "reserve.schema-compat"}}' "$COMPATIBLE_IMAGE")
              FEATURE_COMPAT=$(sudo docker image inspect --format '{{index .Config.Labels "reserve.feature-compat"}}' "$COMPATIBLE_IMAGE")
              if [ "$SCHEMA_COMPAT" != 'v280-mfa-completion-settlement-v1' ] || [ "$FEATURE_COMPAT" != 'waiting-signup-hidden-feed-oauth-login-session-admission-mfa-completion-test-settlement-v11' ]; then
                echo "Cutover requires target and recovery images with login-method compatibility"
                exit 1
              fi
            done

            rollback_cutover() {
              trap - ERR INT TERM HUP
              echo "Cutover failed; restoring frontend and backend routing"

              if [ -f "$ROLLBACK_DIR/previous-release" ]; then
                PREVIOUS_RELEASE=$(cat "$ROLLBACK_DIR/previous-release")
                case "$PREVIOUS_RELEASE" in
                  releases/*)
                    sudo ln -sfn "$PREVIOUS_RELEASE" /usr/share/nginx/html/current.next
                    sudo mv -Tf /usr/share/nginx/html/current.next /usr/share/nginx/html/current
                    ;;
                  none)
                    sudo rm -f /usr/share/nginx/html/current
                    ;;
                  *)
                    echo "Refusing unexpected previous release: $PREVIOUS_RELEASE"
                    ;;
                esac
              fi

              if [ -f "$ROLLBACK_DIR/default.conf" ] && [ -f "$ROLLBACK_DIR/service-env.inc" ]; then
                sudo bash /home/ubuntu/domain-release.sh restore "$FRONTEND_RELEASE" "$ROLLBACK_DIR"
                sudo docker cp "$ROLLBACK_DIR/default.conf" nginxserver:/etc/nginx/conf.d/default.conf
                sudo docker cp "$ROLLBACK_DIR/service-env.inc" nginxserver:/etc/nginx/conf.d/service-env.inc
                sudo docker exec nginxserver nginx -t
                sudo docker exec nginxserver nginx -s reload
              fi

              sudo rm -f "$ROLLBACK_DIR/cutover-started" "$ROLLBACK_DIR/cutover-complete"
              sudo rm -rf -- "$ROLLBACK_TMP"
              sudo rm -f "$NGINX_CANDIDATE"
              exit 1
            }
            trap rollback_cutover ERR INT TERM HUP

            PREVIOUS_RELEASE=$(readlink /usr/share/nginx/html/current 2>/dev/null || printf 'none')
            if [ "$PREVIOUS_RELEASE" != "none" ]; then
              PREVIOUS_ID=${PREVIOUS_RELEASE#releases/}
              if [ "$PREVIOUS_RELEASE" = "$PREVIOUS_ID" ] \
                 || [ ${#PREVIOUS_ID} -ne 40 ] \
                 || printf '%s' "$PREVIOUS_ID" | grep -q '[^0-9a-f]'; then
                echo "Unexpected current frontend symlink: $PREVIOUS_RELEASE"
                exit 1
              fi
            fi

            sudo rm -rf -- "$ROLLBACK_TMP"
            sudo mkdir -p "$ROLLBACK_TMP"
            sudo bash /home/ubuntu/domain-release.sh snapshot "$FRONTEND_RELEASE" "$ROLLBACK_TMP"
            printf '%s\n' "$PREVIOUS_RELEASE" | sudo tee "$ROLLBACK_TMP/previous-release" >/dev/null
            sudo docker cp nginxserver:/etc/nginx/conf.d/default.conf "$ROLLBACK_TMP/default.conf"
            sudo docker cp nginxserver:/etc/nginx/conf.d/service-env.inc "$ROLLBACK_TMP/service-env.inc"
            sudo rm -rf -- "$ROLLBACK_DIR"
            sudo mv "$ROLLBACK_TMP" "$ROLLBACK_DIR"
            sudo touch "$ROLLBACK_DIR/cutover-started"

            PRIVATE_IP=$(hostname -I | awk '{print $1}')
            test -n "$PRIVATE_IP"
            cp "$NGINX_TEMPLATE" "$NGINX_CANDIDATE"
            sed -i "s/PRIVATE_IP/${PRIVATE_IP}/g" "$NGINX_CANDIDATE"
            sed -i "s#root /usr/share/nginx/html/current;#root $RELEASE_DIR;#" "$NGINX_CANDIDATE"
            if grep -Fq 'server_name app.reserve.it.kr;' "$NGINX_CANDIDATE"; then
              MARKETING_RELEASE="/usr/share/nginx/html/marketing/releases/$FRONTEND_RELEASE"
              test -f "$MARKETING_RELEASE/index.html"
              sed -i "s#root /usr/share/nginx/html/marketing/current;#root $MARKETING_RELEASE;#" "$NGINX_CANDIDATE"
            elif grep -Fq 'server_name app.reserve.it.kr;' "$ROLLBACK_DIR/default.conf"; then
              echo 'Domain split cannot be disabled by an ordinary release; use the approved domain recovery procedure'
              exit 1
            fi
            if grep -q 'PRIVATE_IP' "$NGINX_CANDIDATE"; then
              echo "Unresolved PRIVATE_IP placeholder"
              exit 1
            fi
            if ! grep -Fqx "    root $RELEASE_DIR;" "$NGINX_CANDIDATE"; then
              echo "Candidate nginx config does not pin the staged frontend release"
              exit 1
            fi
            if ! sudo docker exec nginxserver nginx -V 2>&1 | grep -q -- '--with-http_sub_module'; then
              echo "nginx is missing ngx_http_sub_module"
              exit 1
            fi

            sudo docker cp "$NGINX_CANDIDATE" nginxserver:/etc/nginx/conf.d/default.conf
            sudo docker exec -e RESERVE_TARGET_UPSTREAM="$TARGET_UPSTREAM" nginxserver sh -eu -c \
              'printf "set \$service_url %s;\n" "$RESERVE_TARGET_UPSTREAM" > /etc/nginx/conf.d/service-env.inc'
            sudo docker exec nginxserver nginx -t

            # current는 운영 도구가 보는 포인터이고, 실제 nginx root는 위 후보의 SHA 절대 경로다.
            if grep -Fq 'server_name app.reserve.it.kr;' "$NGINX_CANDIDATE"; then
              sudo bash /home/ubuntu/domain-release.sh promote "$FRONTEND_RELEASE"
            fi
            sudo ln -sfn "releases/$FRONTEND_RELEASE" /usr/share/nginx/html/current.next
            sudo mv -Tf /usr/share/nginx/html/current.next /usr/share/nginx/html/current
            sudo docker exec nginxserver nginx -s reload
            sudo touch "$ROLLBACK_DIR/cutover-complete"
            sudo rm -f "$NGINX_CANDIDATE"
            trap - ERR INT TERM HUP
            RESERVE_CUTOVER

      # 새 nginx 경로를 통해 정적 자산과 공개 API가 모두 응답한 뒤에만 이전 백엔드를 정지한다.
      - name: Post-deploy smoke
        if: success()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          FRONTEND_RELEASE: ${{ github.sha }}
          TARGET_UPSTREAM: ${{ env.TARGET_UPSTREAM }}
          RESERVE_DOMAIN_SPLIT: ${{ vars.RESERVE_DOMAIN_SPLIT || 'false' }}
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          envs: FRONTEND_RELEASE,TARGET_UPSTREAM,RESERVE_DOMAIN_SPLIT
          script: |
            bash -Eeuo pipefail <<'RESERVE_SMOKE'
            RELEASE_DIR="/usr/share/nginx/html/releases/$FRONTEND_RELEASE"
            if [ "$RESERVE_DOMAIN_SPLIT" = true ]; then PUBLIC_HOST=app.reserve.it.kr; else PUBLIC_HOST=reserve.it.kr; fi
            SMOKE_DIR=$(mktemp -d)
            cleanup() { rm -rf "$SMOKE_DIR"; }
            trap cleanup EXIT

            curl --fail --silent --show-error --max-time 20 \
              --resolve "$PUBLIC_HOST:443:127.0.0.1" \
              "https://$PUBLIC_HOST/" -o "$SMOKE_DIR/index.html"
            grep -q '<div id="root">' "$SMOKE_DIR/index.html"

            curl --fail --silent --show-error --max-time 20 \
              --resolve "$PUBLIC_HOST:443:127.0.0.1" \
              "https://$PUBLIC_HOST/release-id.txt" -o "$SMOKE_DIR/release-id.txt"
            test "$(tr -d '\r\n' < "$SMOKE_DIR/release-id.txt")" = "$FRONTEND_RELEASE"

            ASSET_PATH=$(grep -oE '/assets/[^" ]+\.(js|css)' "$RELEASE_DIR/index.html" | sed -n '1p')
            test -n "$ASSET_PATH"
            curl --fail --silent --show-error --max-time 20 \
              --resolve "$PUBLIC_HOST:443:127.0.0.1" \
              "https://$PUBLIC_HOST$ASSET_PATH" -o "$SMOKE_DIR/asset"
            test -s "$SMOKE_DIR/asset"

            curl --fail --silent --show-error --max-time 20 \
              --resolve "$PUBLIC_HOST:443:127.0.0.1" \
              "https://$PUBLIC_HOST/api/stores?page=0&size=1" -o "$SMOKE_DIR/stores.json"
            jq -e '.success == true and (.data.content | type == "array")' "$SMOKE_DIR/stores.json" >/dev/null
            if [ "$RESERVE_DOMAIN_SPLIT" = true ]; then
              curl --fail --silent --show-error --max-time 20 --resolve reserve.it.kr:443:127.0.0.1 \
                https://reserve.it.kr/release-id.txt -o "$SMOKE_DIR/marketing-release.txt"
              test "$(tr -d '\r\n' < "$SMOKE_DIR/marketing-release.txt")" = "$FRONTEND_RELEASE"
              curl --fail --silent --show-error --max-time 20 --resolve reserve.it.kr:443:127.0.0.1 \
                https://reserve.it.kr/ -o "$SMOKE_DIR/marketing.html"
              grep -q 'id="section-0"' "$SMOKE_DIR/marketing.html"
              grep -q 'id="mobile-section-0"' "$SMOKE_DIR/marketing.html"
            fi

            SERVICE_ENV_LINE=$(sudo docker exec nginxserver cat /etc/nginx/conf.d/service-env.inc \
              | tr -d '\r\n')
            test "$SERVICE_ENV_LINE" = "set \$service_url $TARGET_UPSTREAM;"
            RUNNING_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' "$TARGET_UPSTREAM")
            case "$RUNNING_IMAGE" in
              *":sha-$FRONTEND_RELEASE") ;;
              *) echo "Target backend image does not match the deployed commit"; exit 1 ;;
            esac
            echo "Post-deploy smoke passed through nginx"
            RESERVE_SMOKE

      # health, cutover, smoke 중 어디서 실패해도 새 백엔드를 내리고, 실제 전환이 시작됐다면
      # 저장한 nginx 두 파일과 프론트 포인터를 함께 복구한다.
      - name: Roll back failed deployment
        if: failure() || cancelled()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          FRONTEND_RELEASE: ${{ github.sha }}
          TARGET_UPSTREAM: ${{ env.TARGET_UPSTREAM }}
          DEPLOY_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          envs: FRONTEND_RELEASE,TARGET_UPSTREAM,DEPLOY_ATTEMPT
          script: |
            bash -Eeuo pipefail <<'RESERVE_ROLLBACK'
            [[ "$DEPLOY_ATTEMPT" =~ ^[0-9]+-[0-9]+$ ]] || exit 1
            ROLLBACK_DIR="/home/ubuntu/release-rollback-$FRONTEND_RELEASE-$DEPLOY_ATTEMPT"
            ROLLBACK_TMP="$ROLLBACK_DIR.tmp"
            NGINX_CANDIDATE="/home/ubuntu/default-$FRONTEND_RELEASE-$DEPLOY_ATTEMPT.candidate.conf"

            if [ -f "$ROLLBACK_DIR/cutover-started" ]; then
              PREVIOUS_RELEASE=$(cat "$ROLLBACK_DIR/previous-release")
              case "$PREVIOUS_RELEASE" in
                releases/*)
                  sudo ln -sfn "$PREVIOUS_RELEASE" /usr/share/nginx/html/current.next
                  sudo mv -Tf /usr/share/nginx/html/current.next /usr/share/nginx/html/current
                  ;;
                none)
                  sudo rm -f /usr/share/nginx/html/current
                  ;;
                *)
                  echo "Refusing unexpected previous release: $PREVIOUS_RELEASE"
                  exit 1
                  ;;
              esac
              sudo docker cp "$ROLLBACK_DIR/default.conf" nginxserver:/etc/nginx/conf.d/default.conf
              sudo bash /home/ubuntu/domain-release.sh restore "$FRONTEND_RELEASE" "$ROLLBACK_DIR"
              sudo docker cp "$ROLLBACK_DIR/service-env.inc" nginxserver:/etc/nginx/conf.d/service-env.inc
              sudo docker exec nginxserver nginx -t
              sudo docker exec nginxserver nginx -s reload
              sudo rm -f "$ROLLBACK_DIR/cutover-started" "$ROLLBACK_DIR/cutover-complete"
              echo "Frontend and nginx upstream restored"
            else
              echo "No completed nginx cutover to restore"
            fi
            sudo rm -rf -- "$ROLLBACK_TMP"
            sudo rm -f "$NGINX_CANDIDATE"

            case "${TARGET_UPSTREAM:-}" in
              blue|green)
                sudo docker stop "$TARGET_UPSTREAM" || true
                sudo docker rm "$TARGET_UPSTREAM" || true
                ;;
              *)
                echo "Target upstream was not selected; no backend container to remove"
                ;;
            esac
            RESERVE_ROLLBACK

      # 새 릴리스 확인 후 정리 실패는 활성 버전을 되돌리지 않으며 남은 컨테이너는 후속 점검한다.
      - name: Stop old server (best effort)
        if: success()
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          script: |
            # 이전 컨테이너가 없는 경우에는 정리를 건너뛴다.
            if [ "${{ env.CURRENT_UPSTREAM }}" = "none" ]; then
              echo "No previous container to stop (first deploy or both were down)"
            else
              sudo docker stop ${{ env.CURRENT_UPSTREAM }} || true
              sudo docker rm   ${{ env.CURRENT_UPSTREAM }} || true
            fi

      - name: Cleanup release resources (best effort)
        if: success()
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          FRONTEND_RELEASE: ${{ github.sha }}
          DEPLOY_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          username: ubuntu
          host: ${{ secrets.RESERVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ env.RESERVE_SSH_FINGERPRINT }}
          envs: FRONTEND_RELEASE,DEPLOY_ATTEMPT
          script: |
            bash -Eeuo pipefail <<'RESERVE_CLEANUP'
            case "$FRONTEND_RELEASE" in
              ''|*[!0-9a-f]*) echo "Invalid frontend release id"; exit 1 ;;
            esac
            if [ ${#FRONTEND_RELEASE} -ne 40 ]; then
              echo "Frontend release id must be a full commit SHA"
              exit 1
            fi
            [[ "$DEPLOY_ATTEMPT" =~ ^[0-9]+-[0-9]+$ ]] || exit 1

            RELEASE_ROOT=/usr/share/nginx/html/releases
            RESOLVED_RELEASE_ROOT=$(readlink -f "$RELEASE_ROOT")
            RESOLVED_CURRENT_RELEASE=$(readlink -f /usr/share/nginx/html/current)
            find "$RELEASE_ROOT" -mindepth 1 -maxdepth 1 -type d \
              -regextype posix-extended -regex '.*/[0-9a-f]{40}' -printf '%T@ %p\n' \
              | sort -rn \
              | awk -v current="$RESOLVED_CURRENT_RELEASE" '$2 != current { seen++; if (seen > 2) print $2 }' \
              | while IFS= read -r OLD_RELEASE; do
                  RESOLVED_OLD_RELEASE=$(readlink -f "$OLD_RELEASE")
                  case "$RESOLVED_OLD_RELEASE" in
                    "$RESOLVED_RELEASE_ROOT"/*)
                      if [ "$RESOLVED_OLD_RELEASE" != "$RESOLVED_CURRENT_RELEASE" ]; then
                        sudo rm -rf -- "$RESOLVED_OLD_RELEASE"
                      fi
                      ;;
                    *) echo "Refusing to remove unexpected path: $RESOLVED_OLD_RELEASE"; exit 1 ;;
                  esac
                done

            sudo rm -rf -- "/home/ubuntu/release-rollback-$FRONTEND_RELEASE-$DEPLOY_ATTEMPT"
            rm -f "/home/ubuntu/default-$FRONTEND_RELEASE.conf"
            RESERVE_CLEANUP
