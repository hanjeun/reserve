# 기존 모니터링·SMTP 구성에 알림 HTML만 덮어쓰며 Grafana 단독 변경 승인이 필요하다.
# 텍스트 알림과 계정·보안 메일은 유지한다.
services:
  grafana:
    # 알림 링크의 공개 주소를 지정하며 SMTP와 경로 설정은 유지한다.
    environment:
      GF_SERVER_ROOT_URL: https://grafana.reserve.it.kr/
    volumes:
      - type: bind
        source: ./grafana/emails/ng_alert_notification.html
        target: /usr/share/grafana/public/emails/ng_alert_notification.html
        read_only: true
        bind:
          create_host_path: false
