# 모든 환경 공통 설정

# 서버 공통 설정
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      tracking-modes: cookie
      timeout: 30m
      cookie:
        max-age: 1800

# Spring 공통 설정
spring:
  data:
    web:
      pageable:
        serialization-mode: VIA_DTO  # PageImpl JSON 직렬화 경고 제거
  web:
    resources:
      add-mappings: true

  # 파일 업로드
  servlet:
    multipart:
      enabled: true
      max-file-size: 8MB      # SonarCloud: 8MB 이하 권장 (DoS 방지)
      max-request-size: 8MB   # SonarCloud: 8MB 이하 권장 (DoS 방지)
      file-size-threshold: 2MB

  # JPA 공통 설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # HikariCP 커넥션 풀 설정 (죽은 커넥션 빠르게 감지/교체)
  datasource:
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 3000
      connection-timeout: 10000
      max-lifetime: 580000       # MySQL wait_timeout(600s)보다 짧게
      keepalive-time: 60000      # 60초마다 커넥션 유지 쿼리

  # OAuth2 Provider 설정 (공통)
  security:
    oauth2:
      client:
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# JWT 설정
jwt:
  issuer: reserve
  absolute-session-lifetime: ${JWT_ABSOLUTE_SESSION_LIFETIME:30d}
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 14

# 로깅 설정
logging:
  level:
    root: INFO
    kr.it.reserve: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 메일 설정
mail:
  host: smtp.resend.com
  port: 465
  from: ${MAIL_FROM:reserve@reserve.it.kr}
  from-name: ${MAIL_FROM_NAME:RESERVE}
  admin-notify: ${MAIL_ADMIN_NOTIFY:hanjeun111@gmail.com}
  properties:
    mail:
      smtp:
        auth: true
        ssl:
          enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# 포트원 설정
portone:
  pg-provider: ${PORTONE_PG_PROVIDER:kakaopay}

# CORS 허용 출처는 환경별 설정에만 둬 공통 설정이 로컬 출처를 덮어쓰지 않게 한다.

# Actuator (헬스체크)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never   # 운영 환경에서 내부 정보 비노출

chat:
  retention:
    # 실제 고지 시각부터 30일이 지나야 글·사진·신고 증거 파기를 시작한다.
    enabled: ${CHAT_RETENTION_ENABLED:false}
    notice-published-at: ${CHAT_RETENTION_NOTICE_PUBLISHED_AT:}
    access-audit-years: ${CHAT_RETENTION_ACCESS_AUDIT_YEARS:1}

waiting:
  retention:
    # 새 접수 자료에만 적용한다. 실제 게시 시각이 없으면 실행하지 않는다.
    enabled: ${WAITING_RETENTION_ENABLED:true}
    notice-published-at: ${WAITING_RETENTION_NOTICE_PUBLISHED_AT:}
    # 직원 접수 고지 시각을 고객 접수 고지로 재사용하지 않는다. 비면 새 고객 접수·고객 정리를 중지한다.
    customer-notice-published-at: ${WAITING_CUSTOMER_RETENTION_NOTICE_PUBLISHED_AT:}

reserve:
  reservation-retention:
    enabled: ${RESERVE_RESERVATION_RETENTION_ENABLED:false}
    purge-enabled: ${RESERVE_RESERVATION_RETENTION_PURGE_ENABLED:false}
  mfa:
    enabled: ${RESERVE_MFA_ENABLED:false}
    rp-id: ${RESERVE_MFA_RP_ID:app.reserve.it.kr}
    origins: ${RESERVE_MFA_ORIGINS:https://app.reserve.it.kr}
    encryption-key: ${RESERVE_MFA_ENCRYPTION_KEY:}
  reservation:
    auto-completion-enabled: ${RESERVE_RESERVATION_AUTO_COMPLETION_ENABLED:false}
  settlement:
    test-enabled: ${RESERVE_SETTLEMENT_TEST_ENABLED:false}
  service-admission:
    # 방문 입장권 수이며 DB 연결 수나 실측 처리량이 아니다. Redis 수동 모드가 우선한다.
    enabled: ${RESERVE_SERVICE_ADMISSION_ENABLED:false}
    capacity: ${RESERVE_SERVICE_ADMISSION_CAPACITY:20}
    session-seconds: ${RESERVE_SERVICE_ADMISSION_SESSION_SECONDS:900}
    max-session-seconds: ${RESERVE_SERVICE_ADMISSION_MAX_SESSION_SECONDS:7200}
    heartbeat-timeout-seconds: ${RESERVE_SERVICE_ADMISSION_HEARTBEAT_TIMEOUT_SECONDS:90}
    max-waiting: ${RESERVE_SERVICE_ADMISSION_MAX_WAITING:1000}
    epoch: ${RESERVE_SERVICE_ADMISSION_EPOCH:}
    automatic:
      enabled: ${RESERVE_SERVICE_ADMISSION_AUTOMATIC_ENABLED:false}
      # 초기 보호 임계값이며 이 관측값에서 처리량·지연 한도를 추정하지 않는다.
      memory-pressure-mib: 128
      memory-clear-mib: 256
      cpu-pressure-percent: 90
      cpu-clear-percent: 65
      heap-pressure-percent: 90
      heap-clear-percent: 75
      pressure-seconds: 30
      recovery-seconds: 120
      minimum-emergency-seconds: 120
  admission:
    enabled: ${RESERVE_ADMISSION_ENABLED:false}
  redis:
    enabled: ${RESERVE_REDIS_ENABLED:false}
    port: ${RESERVE_REDIS_PORT:6379}
    password: ${RESERVE_REDIS_PASSWORD:}
    username: ${RESERVE_REDIS_USERNAME:}

app:
  frontend-url: ${APP_FRONTEND_URL:}
  public-url: ${APP_PUBLIC_URL:}
  marketing-url: ${APP_MARKETING_URL:https://reserve.it.kr}
  legacy-frontend-url: ${APP_LEGACY_FRONTEND_URL:}

# Sentry 에러 모니터링
sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  traces-sample-rate: 0.1
  environment: ${SPRING_PROFILES_ACTIVE:local}
