plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

// 의존성 잠금으로 재현 가능한 버전을 유지한다.
dependencyLocking {
    lockAllConfigurations()
}

group = 'kr.it.reserve'
// 프론트 package.json과 릴리스 버전을 맞춘다.

version = '2.16.0'
description = 'We are reserve'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// BOM에서 관리하지 않는 JJWT 버전을 한곳에서 지정한다.


ext {
    jjwtVersion = '0.13.0'
}

// Spring Boot BOM 이후의 호환 보안 패치를 지정한다.
ext['jackson-bom.version'] = '2.21.8'
ext['netty.version'] = '4.1.139.Final'
ext['tomcat.version'] = '10.1.61'
ext['httpclient5.version'] = '5.6.3'
ext['httpcore5.version'] = '5.4.3'
ext['log4j2.version'] = '2.25.5'

dependencies {

    implementation platform('software.amazon.awssdk:bom:2.56.0')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.61.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.yubico:webauthn-server-core:2.10.1'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    // Spring Boot BOM의 Jakarta 버전을 사용한다.

    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'


    implementation 'software.amazon.awssdk:s3'


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'org.springframework.security:spring-security-test'
    // 모듈 사이의 순환 의존을 검사한다.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    

    runtimeOnly 'com.h2database:h2'
}

// 공개 가게 HTML은 동일 릴리스의 프론트 빌드와 묶는다.
tasks.named('processResources') {
    from('../frontend/dist/index.html') { into 'store-shell' }
}
tasks.named('bootJar') {
    doFirst {
        if (!file('../frontend/dist/index.html').isFile()) {
            throw new GradleException('Build the frontend before packaging store pages')
        }
    }
}

apply from: '../scripts/dependency-notices.gradle'


jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    // 워커를 재사용하는 동안 쌓인 Spring·ArchUnit 상태를 주기적으로 해제한다.
    forkEvery = 50
    systemProperty 'reserve.toolTestClasspath', sourceSets.test.runtimeClasspath.asPath
}

// 운영 도구를 격리된 읽기 전용 테스트에서 검사한다.
tasks.named('compileTestJava') {
    source '../scripts/java/kr/it/reserve/tools/PrepareAdmissionCampaign.java'
    source '../scripts/java/kr/it/reserve/tools/PrepareServiceAdmission.java'
    source '../scripts/tests/kr/it/reserve/tools/PrepareServiceAdmissionTest.java'
    source '../scripts/java/kr/it/reserve/tools/VerifyDatabaseSchema.java'
    source '../scripts/java/kr/it/reserve/tools/VerifyChatImageRecovery.java'
    source '../scripts/tests/kr/it/reserve/tools/VerifyChatImageRecoveryTest.java'
}
