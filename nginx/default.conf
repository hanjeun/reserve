# IP별 API·정적 파일 요청을 각각 제한한다.
limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=20r/s;
limit_req_zone $binary_remote_addr zone=static_zone:10m rate=80r/s;
limit_req_zone $binary_remote_addr zone=csp_zone:1m     rate=2r/s;

limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# IP·쿼리·동적 ID·인증 정보·본문 없이 응답 지연을 기록한다.
map $uri $reserve_log_route {
    default                         "spa";
    ~^/assets/                      "asset";
    ~^/api/(?:v1/)?stores/[0-9]+             "store_detail";
    ~^/api/(?:v1/)?stores                    "store_list";
    ~^/api/(?:v1/)?chat                      "chat";
    ~^/api/                         "api_other";
    /actuator/health                "health";
}
log_format reserve_timing escape=json
    '{"time":"$msec","route":"$reserve_log_route","method":"$request_method",'
    '"status":$status,"request_time":"$request_time",'
    '"upstream_connect_time":"$upstream_connect_time","upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time","cache":"$upstream_cache_status"}';

# 색인 경로는 useRouteSeo와 백엔드 사이트맵 정책에 맞춘다.
# 내부 리다이렉트에도 유지되는 원본 $request_uri로 판정한다.
map $request_uri $reserve_robots_tag {
    default                            "noindex, nofollow";
    "~^/(\?.*)?$"                      "";
    "~^/stores/?(\?.*)?$"              "";
    "~^/store/[0-9]+/?(\?.*)?$"        "";
    "~^/terms/?(\?.*)?$"               "";
    "~^/privacy/?(\?.*)?$"             "";
    "~^/content-sources/?(\?.*)?$"      "";
    "~^/operation-guide/?(\?.*)?$"     "";
    "~^/guide/(user|business|common)/?(\?.*)?$" "";
}

# 공개 경로의 원본 HTML 메타를 요청 경로에 맞춘다.
# 빈 문자열은 정규식으로 판정하지 않고 차단할 값만 명시한다.
map $reserve_robots_tag $reserve_robots_meta {
    default                             "index, follow";
    "noindex, nofollow"                 "noindex, nofollow";
}

map $request_uri $reserve_canonical_url {
    default                             "https://reserve.it.kr/";
    "~^/(\?.*)?$"                       "https://reserve.it.kr/";
    "~^/stores/?(\?.*)?$"               "https://reserve.it.kr/stores";
    "~^/store/(?<reserve_store_id>[0-9]+)/?(\?.*)?$" "https://reserve.it.kr/store/$reserve_store_id";
    "~^/terms/?(\?.*)?$"                "https://reserve.it.kr/terms";
    "~^/privacy/?(\?.*)?$"              "https://reserve.it.kr/privacy";
    "~^/content-sources/?(\?.*)?$"      "https://reserve.it.kr/content-sources";
    "~^/operation-guide/?(\?.*)?$"      "https://reserve.it.kr/guide/common";
    "~^/guide/user/?(\?.*)?$"           "https://reserve.it.kr/guide/user";
    "~^/guide/business/?(\?.*)?$"       "https://reserve.it.kr/guide/business";
    "~^/guide/common/?(\?.*)?$"         "https://reserve.it.kr/guide/common";
}

map $request_uri $reserve_page_title {
    default                             "RESERVE | 예약이 필요한 순간";
    "~^/stores/?(\?.*)?$"               "가게 목록 | RESERVE";
    "~^/store/[0-9]+/?(\?.*)?$"         "가게 상세 | RESERVE";
    "~^/terms/?(\?.*)?$"                "서비스 이용약관 | RESERVE";
    "~^/privacy/?(\?.*)?$"              "개인정보 처리방침 | RESERVE";
    "~^/content-sources/?(\?.*)?$"      "콘텐츠 출처·권리 안내 | RESERVE";
    "~^/operation-guide/?(\?.*)?$"      "공통 이용안내 | RESERVE";
    "~^/guide/user/?(\?.*)?$"           "사용자 이용안내 | RESERVE";
    "~^/guide/business/?(\?.*)?$"       "사업자 이용안내 | RESERVE";
    "~^/guide/common/?(\?.*)?$"         "공통 이용안내 | RESERVE";
}

map $request_uri $reserve_page_description {
    default                             "필라테스 스튜디오부터 헤어샵, 병원까지 — 예약이 필요한 순간, RESERVE가 가장 빠르게 도와드립니다.";
    "~^/stores/?(\?.*)?$"               "원하는 조건으로 최고의 가게를 찾아보세요. RESERVE에서 다양한 업종을 간편하게 예약할 수 있습니다.";
    "~^/store/[0-9]+/?(\?.*)?$"         "가게 정보와 예약 가능 시간을 확인하고 RESERVE에서 예약하세요.";
    "~^/terms/?(\?.*)?$"                "RESERVE 서비스 이용약관 — 회원 자격, 예약과 결제, 취소·환불, 책임 범위를 안내합니다.";
    "~^/privacy/?(\?.*)?$"              "RESERVE 개인정보 처리방침 — 수집하는 항목, 이용 목적, 보관 기간, 파기 절차와 이용자 권리를 안내합니다.";
    "~^/content-sources/?(\?.*)?$"      "RESERVE에서 사용하는 콘텐츠의 출처와 권리 정보를 안내합니다.";
    "~^/operation-guide/?(\?.*)?$"      "계정과 검색, 문의하기와 서비스 정책을 확인하는 방법을 안내해요.";
    "~^/guide/user/?(\?.*)?$"           "가게 찾기와 예약, 웨이팅 접수·QR 이용 방법을 안내해요.";
    "~^/guide/business/?(\?.*)?$"       "가게 등록·수정과 예약·웨이팅·QR·광고·채팅 관리 방법을 안내해요.";
    "~^/guide/common/?(\?.*)?$"         "계정과 검색, 문의하기와 서비스 정책을 확인하는 방법을 안내해요.";
}

upstream blue {
    server PRIVATE_IP:8080;
}
upstream green {
    server PRIVATE_IP:8081;
}
server {
    listen 80;
    listen [::]:80;
    server_name reserve.it.kr www.reserve.it.kr;
    access_log /var/log/nginx/access.log reserve_timing;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://reserve.it.kr$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reserve.it.kr www.reserve.it.kr;
    ssl_certificate /etc/letsencrypt/live/reserve.it.kr/fullchain.pem;
    access_log /var/log/nginx/access.log reserve_timing;
    ssl_certificate_key /etc/letsencrypt/live/reserve.it.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 배포는 current 심볼릭 링크를 원자적으로 교체한다.
    root /usr/share/nginx/html/current;
    index index.html;

    # 이미 압축된 이미지·폰트를 제외하고 응답을 압축한다.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    # add_header가 있는 각 location에 보안 헤더를 함께 선언한다.
    # CSP는 Report-Only이며 강제 적용은 실제 위반 확인과 별도 승인이 필요하다.
    # 결제·지도·오류 수집의 외부 출처와 런타임 스타일 허용은 관련 SDK 변경 시 재검토한다.
    # 사이트맵은 백엔드의 공개 가게 목록을 사용한다.
    location = /sitemap.xml {
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    # 공개 브라우저 진단 수집은 일반 API보다 엄격하게 제한한다.
    # 내부 재매핑으로 두 API 별칭에 같은 본문·요청 제한을 적용한다.
    location = /api/v1/csp-reports { rewrite ^ /api/csp-reports last; }
    location = /api/csp-reports {
        client_max_body_size 32k;
        limit_req zone=csp_zone burst=10 nodelay;
        limit_req_status 429;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    # 원본 HTML과 공유 메타에 같은 공개 가게 권한을 적용한다.
    location ~ ^/store/(?<public_store_id>[0-9]+)/?$ {
        limit_req zone=api_zone burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_zone 50;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.portone.io https://dapi.kakao.com https://t1.kakaocdn.net https://*.daumcdn.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.reserve.it.kr https://*.daumcdn.net https://*.kakaocdn.net https://placehold.co https://images.unsplash.com https://lh3.googleusercontent.com; connect-src 'self' https://*.sentry.io https://dapi.kakao.com https://*.daumcdn.net https://cdn.reserve.it.kr https://*.portone.io https://*.iamport.kr; worker-src 'self' blob:; frame-src 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; form-action 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri /api/csp-reports" always;
        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url/api/public/store-pages/$public_store_id;
        proxy_set_header Accept "text/html";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        limit_req_status 429;
        limit_conn conn_zone 50;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /oauth2/authorization/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /login/oauth2/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location / {
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;

        # HTML은 재검증하고 해시 자산은 별도 장기 캐시를 사용한다.
        add_header Cache-Control "no-cache";

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        add_header X-Robots-Tag $reserve_robots_tag always;

        # 크롤러가 요청 경로에 맞는 메타를 받도록 HTML을 변환한다.
        # sub_filter 모듈을 확인하고 변환 응답에 원본의 Last-Modified를 재사용하지 않는다.
        sub_filter_once on;
        sub_filter '<title>RESERVE | 예약이 필요한 순간</title>' '<title>$reserve_page_title</title>';
        sub_filter '<meta name="description" content="필라테스 스튜디오부터 헤어샵, 병원까지 — 예약이 필요한 순간, RESERVE가 가장 빠르게 도와드립니다." />' '<meta name="description" content="$reserve_page_description" />';
        sub_filter '<meta name="robots" content="index, follow" />' '<meta name="robots" content="$reserve_robots_meta" />';
        sub_filter '<link rel="canonical" href="https://reserve.it.kr" />' '<link rel="canonical" href="$reserve_canonical_url" />';
        sub_filter '<meta property="og:url" content="https://reserve.it.kr" />' '<meta property="og:url" content="$reserve_canonical_url" />';

        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.portone.io https://dapi.kakao.com https://t1.kakaocdn.net https://*.daumcdn.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.reserve.it.kr https://*.daumcdn.net https://*.kakaocdn.net https://placehold.co https://images.unsplash.com https://lh3.googleusercontent.com; connect-src 'self' https://*.sentry.io https://dapi.kakao.com https://*.daumcdn.net https://cdn.reserve.it.kr https://*.portone.io https://*.iamport.kr; worker-src 'self' blob:; frame-src 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; form-action 'self' https://*.portone.io https://*.iamport.kr https://*.kakao.com https://*.kakaopay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-uri /api/csp-reports" always;

        try_files $uri $uri/ /index.html;
    }

    # 내용 해시가 붙은 자산은 장기 캐시한다.
    location ^~ /assets/ {
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }

    # 해시 없는 폰트·이미지는 변경 여부를 재검증한다.
    location ~* \.(?:woff2?|png|jpe?g|webp|gif|svg|ico)$ {
        limit_req zone=static_zone burst=120 nodelay;
        limit_req_status 429;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name grafana.reserve.it.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://grafana.reserve.it.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name grafana.reserve.it.kr;
    ssl_certificate /etc/letsencrypt/live/grafana.reserve.it.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.reserve.it.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Grafana 자체 프레임 정책을 유지하고 HSTS·nosniff를 추가한다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
