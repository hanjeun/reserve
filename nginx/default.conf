upstream blue {
    server 172.31.45.145:8080;
}
upstream green {
    server 172.31.45.145:8081;
}
server {
    listen 80;
    listen [::]:80;
    server_name hktech.kr www.hktech.kr reserve.hktech.kr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reserve.hktech.kr;
    ssl_certificate /etc/letsencrypt/live/hktech.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hktech.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    location /uploads/ {
        alias /home/ubuntu/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /api/ {
        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /oauth2/authorization/ {
        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /login/oauth2/ {
        include /etc/nginx/conf.d/service-env.inc;
        proxy_pass http://$service_url;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hktech.kr www.hktech.kr;
    ssl_certificate /etc/letsencrypt/live/hktech.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hktech.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 나중에 회사 홍보 사이트로 바꿀 때 이 부분 수정
    return 301 https://reserve.hktech.kr$request_uri;
}
