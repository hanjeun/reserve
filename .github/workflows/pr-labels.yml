name: PR Labels

# PR 제목의 type(feat, fix …)과 바뀐 경로(frontend, backend …)로 라벨을 붙인다.
# Dependabot PR은 dependabot.yml 의 labels 로 이미 붙어서 건너뛴다.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [ "main", "dev" ]

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const TYPE_LABELS = {
              feat: { name: 'feat', color: '0e8a16', description: 'New product functionality' },
              fix: { name: 'fix', color: 'd73a4a', description: 'Bug fix' },
              refactor: { name: 'refactor', color: '1d76db', description: 'Code change without behavior change' },
              docs: { name: 'documentation', color: '0075ca', description: 'Improvements or additions to documentation' },
              chore: { name: 'chore', color: '6f42c1', description: 'Maintenance, tooling, and repository operations' },
              release: { name: 'release', color: '5319e7', description: 'Release to production' },
              style: { name: 'style', color: 'c5def5', description: 'Visual or formatting change' },
              test: { name: 'test', color: 'bfd4f2', description: 'Tests only' },
              perf: { name: 'perf', color: 'fbca04', description: 'Performance improvement' },
            };
            const AREA_LABELS = [
              { name: 'frontend', color: '61dafb', description: 'Frontend (React)', match: (f) => f.startsWith('frontend/') },
              { name: 'backend', color: '6db33f', description: 'Backend (Spring Boot)', match: (f) => f.startsWith('backend/') },
              {
                name: 'infra', color: 'ff9900', description: 'CI, deploy, server and monitoring',
                match: (f) => /^(\.github\/|nginx\/|scripts\/|grafana\/|docker-compose[^/]*\.yml$|promtail-config\.yml$|\.sonarcloud\.properties$)/.test(f),
              },
              { name: 'documentation', color: '0075ca', description: 'Improvements or additions to documentation', match: (f) => f.startsWith('docs/') || /^[^/]+\.md$/.test(f) },
            ];

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const ensureLabel = async ({ name, color, description }) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            const typeMatch = /^(\w+)(\([^)]*\))?!?:/.exec(pr.title);
            const typeLabel = typeMatch ? TYPE_LABELS[typeMatch[1]] : undefined;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const paths = files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean));
            const areaLabels = AREA_LABELS.filter((area) => paths.some(area.match));

            const wanted = [typeLabel, ...areaLabels].filter(Boolean);
            for (const label of wanted) await ensureLabel(label);

            // 제목의 type 이 바뀌면 이전 type 라벨은 뗀다(경로 라벨과 겹치는 documentation 은 남긴다).
            const wantedNames = new Set(wanted.map((label) => label.name));
            const typeNames = new Set(Object.values(TYPE_LABELS).map((label) => label.name));
            for (const label of pr.labels) {
              if (typeNames.has(label.name) && !wantedNames.has(label.name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label.name });
              }
            }
            if (wantedNames.size > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [...wantedNames] });
            }
