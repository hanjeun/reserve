<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale 제거: 접근성 이슈 (SonarCloud: viewport limits zoom) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="naver-site-verification" content="0fad6c7c4edff9b13ddd3c091f6333800a7b2f83" />
    <meta name="google-site-verification" content="y8MdWPVUNyUeyZVVjR8cFuc5v2QpcsboE_SLmhZp75Y" />

    <!-- ─── 기본 SEO ──────────────────────────────────────── -->
    <title>RESERVE | 예약이 필요한 순간</title>
    <meta name="description" content="필라테스 스튜디오부터 헤어샵, 병원까지 — 예약이 필요한 순간, RESERVE가 가장 빠르게 도와드립니다." />
    <meta name="keywords" content="예약, 온라인 예약, 가게 예약, 헤어샵 예약, 필라테스 예약, 병원 예약, RESERVE" />
    <meta name="author" content="RESERVE" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://reserve.it.kr" />

    <!-- ─── Open Graph (카카오, 슬랙, 페이스북 공유 미리보기) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RESERVE" />
    <meta property="og:title" content="RESERVE | 예약이 필요한 순간" />
    <meta property="og:description" content="예약이 필요한 순간, 원하는 가게를 찾고 가장 빠르게 예약하세요." />
    <meta property="og:image" content="https://reserve.it.kr/og-image.png" />
    <meta property="og:image:secure_url" content="https://reserve.it.kr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RESERVE - 예약이 필요한 순간" />
    <meta property="og:url" content="https://reserve.it.kr" />
    <meta property="og:locale" content="ko_KR" />

    <!-- ─── Twitter Card ─────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RESERVE | 예약이 필요한 순간" />
    <meta name="twitter:description" content="예약이 필요한 순간, 원하는 가게를 찾고 가장 빠르게 예약하세요." />
    <meta name="twitter:image" content="https://reserve.it.kr/og-image.png" />

    <!-- ─── 아이콘 ────────────────────────────────────────── -->
    <!-- SVG는 지원 브라우저에서 우선 사용, PNG는 미지원 브라우저(iOS Safari 등) 폴백 -->
    <!-- apple-touch-icon은 반드시 PNG여야 함 — SVG는 iOS가 무시하고 기본 아이콘으로 대체함 -->
    <!-- PNG 폴백은 512px 원본(R_logo.png)을 그대로 준다. 예전엔 16/32px 파일을 줬는데
         고DPI 화면에서 그 작은 원본이 확대돼 뭉개져 보였다. 브라우저가 큰 원본을 축소하는
         편이 훨씬 선명하고, 파일도 이미 저장소에 있는 것을 재사용한다. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/R_logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- ─── JSON-LD 구조화 데이터 (구글 리치 결과) ───────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RESERVE",
      "description": "예약이 필요한 순간",
      "url": "https://reserve.it.kr",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://reserve.it.kr/stores?keyword={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "RESERVE",
        "url": "https://reserve.it.kr",
        "logo": {
          "@type": "ImageObject",
          "url": "https://reserve.it.kr/icons/favicon.svg"
        }
      }
    }
    </script>

    <!-- 포트원 결제 SDK 는 더 이상 여기서 로드하지 않는다 (2026-08-10 V2 전환).
         @portone/browser-sdk 가 결제를 시작하는 순간에만 cdn.portone.io 스크립트를 주입하므로,
         결제하지 않는 대부분의 방문자는 이 스크립트를 아예 받지 않는다.
         CSP script-src 에는 cdn.portone.io 가 필요하다 — nginx/default.conf 참고. -->
    <!-- 카카오맵 JavaScript SDK (autoload=false → 컴포넌트에서 명시적 load) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_JS_KEY%&autoload=false&libraries=services"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
